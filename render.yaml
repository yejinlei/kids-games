services:
  - type: web
    name: kids-games-shanhe
    runtime: python
    plan: free
    branch: master
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /api/rooms
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: ALLOW_UNSAFE_WERKZEUG
        value: "true"
