app = "kids-games-shanhe"
primary_region = "sjc"

[build]
  # Paketo Python 构建包：识别 requirements.txt 安装依赖，按 Procfile 启动 web 进程
  builder = "paketobuildpacks/builder-jammy-base"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256
