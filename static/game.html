<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>山河之旅 · 儿童桌游</title>
  <style>
    :root {
      --bg: #eaf4ff;
      --panel: #ffffff;
      --ink: #2c3e50;
      --muted: #7f8c9b;
      --primary: #ff7a59;
      --primary-d: #ef5e3a;
      --accent: #2ecc71;
      --line: #d8e3ef;
      --shadow: 0 6px 18px rgba(40, 80, 140, .12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #fff 0%, var(--bg) 60%);
      color: var(--ink);
      min-height: 100vh;
    }
    .hidden { display: none !important; }
    /* 游戏进行中：页面锁定一屏（无滚动条），topbar + 游戏区正好占满视口 */
    body.in-game { height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
    body.in-game .topbar { flex: 0 0 auto; position: static; }
    body.in-game #game { flex: 1; min-height: 0; height: auto; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; background: #fff; box-shadow: var(--shadow);
      position: sticky; top: 0; z-index: 10;
    }
    .logo { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
    .room-tag {
      background: #eef6ff; color: #2b6cb0; padding: 6px 12px; border-radius: 999px;
      font-weight: 700; font-size: 14px;
    }
    .screen { padding: 20px; max-width: 1800px; margin: 0 auto; }
    .lobby-card {
      background: var(--panel); border-radius: 20px; padding: 28px;
      box-shadow: var(--shadow); max-width: 480px; margin: 30px auto;
    }
    .lobby-card h1 { margin: 0 0 6px; font-size: 26px; }
    .subtitle { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
    input, select {
      width: 100%; padding: 10px 12px; border: 1.5px solid var(--line);
      border-radius: 12px; font-size: 15px; outline: none; background: #fbfdff;
    }
    input:focus, select:focus { border-color: var(--primary); }
    .row { display: flex; gap: 12px; }
    .row label { flex: 1; }
    hr { border: none; border-top: 1px dashed var(--line); margin: 20px 0; }
    .btn-group { margin-top: 14px; }
    .btn {
      border: none; border-radius: 14px; padding: 12px 18px; font-size: 15px;
      font-weight: 700; cursor: pointer; background: #eef2f7; color: var(--ink);
      transition: transform .06s ease, filter .15s ease; width: 100%;
    }
    .btn:hover { filter: brightness(1.03); }
    .btn:active { transform: translateY(1px); }
    .btn.primary { background: var(--primary); color: #fff; }
    .btn.primary:hover { background: var(--primary-d); }
    .btn.ghost { background: #fff; border: 1.5px solid var(--line); margin-top: 10px; }
    .btn.filter-on { background: var(--primary); color: #fff; border-color: var(--primary); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .msg { text-align: center; color: var(--primary-d); margin-top: 14px; font-weight: 700; }
    .conn-badge {
      position: fixed; top: 12px; right: 12px; z-index: 999;
      padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700;
      background: #fff; box-shadow: var(--shadow); border: 1.5px solid var(--line);
    }
    .conn-badge.good { color: #1a7f37; border-color: #1a7f37; }
    .conn-badge.bad { color: #c2410c; border-color: #c2410c; }
    .conn-badge.init { color: #666; }
    .rejoin-box { margin-top: 16px; padding: 14px; background: #fff7f3; border-radius: 14px; text-align: center; }
    .room-list-box { margin-top: 4px; }
    .room-list-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; color: var(--ink-2, #444); }
    .btn.tiny { padding: 4px 12px; font-size: 12px; margin-top: 0; }
    .static-field { padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: #f7f7f7; color: #555; font-size: 14px; }
    .tip { margin-top: 8px; font-size: 12px; color: #777; line-height: 1.5; }
    .section-title { margin: 4px 0 10px; font-weight: 800; font-size: 15px; color: var(--primary-d, #c2410c); }
    .room-list { margin-top: 10px; display: grid; gap: 8px; max-height: 180px; overflow-y: auto; }
    .room-item {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 12px;
      background: #fff; cursor: pointer; font-size: 14px;
    }
    .room-item:hover { border-color: var(--primary, #ff6b35); background: #fff7f3; }
    .room-item .rid { font-weight: 800; font-size: 16px; letter-spacing: 2px; }
    .room-item .meta { color: #777; font-size: 12px; }
    /* 进行中/已满/已结束的房间：灰显列出，保证玩家找得到自己的房间 */
    .room-item.dim { opacity: .55; cursor: not-allowed; background: #f6f7f9; }
    .room-item.dim:hover { border-color: var(--line); background: #f6f7f9; }
    .room-dim-head { font-size: 12px; color: #999; text-align: center; padding: 2px 0; }
    .room-empty { text-align: center; color: #999; font-size: 13px; padding: 12px; }

    /* 游戏界面：整体锁定在一屏内（无页面滚动条）；
       左侧地图铺满剩余空间，右侧侧边栏内部自行伸缩 */
    #game {
      display: grid; grid-template-columns: minmax(0, 1fr) 640px; gap: 12px;
      height: 100vh; max-width: none; padding: 12px; box-sizing: border-box;
      overflow: hidden; align-items: stretch;
      /* body.in-game 是 flex 列布局：.screen 的 margin:auto 会让本块收缩居中，
         必须显式占满整行，地图才能铺满剩余宽度 */
      width: 100%; margin: 0;
    }
    .board-wrap {
      background: var(--panel); border-radius: 20px; padding: 12px; box-shadow: var(--shadow);
      display: flex; flex-direction: column; min-width: 0; min-height: 0;
    }
    .board-wrap svg { background: #e3f1fb; border-radius: 14px; display: block; width: 100%; height: 100%; }
    /* 球面视图：Canvas 绘制的可旋转地球（零依赖，离线可用） */
    .globe { display: block; width: 100%; height: 100%;
      border-radius: 14px; background: #cfe9f4; cursor: grab; touch-action: none; }
    .globe.dragging { cursor: grabbing; }
    .globe.hidden { display: none; }
    .board.dark + .globe { background: #0f1d33; }
    .land { fill: #eef6ea; stroke: #a9c0a4; stroke-width: 1.5; stroke-linejoin: round; }
    .route { opacity: .5; }
    .route.reach { opacity: 1; }
    .city.reach .city-circle { stroke: var(--primary, #ff6b35); stroke-width: 3; }
    .city-label .cost { fill: var(--primary, #ff6b35); font-size: 9px; font-weight: 800; }
    .move-path { fill: none; stroke: #ff6b35; stroke-width: calc(2.6px / var(--zs, 1)); stroke-linecap: round; opacity: .85; }
    .move-hint { text-align: center; margin-top: 10px; font-size: 13px; font-weight: 700; color: var(--primary-d, #c2410c); }
    /* 旗杆 + 旗帜定位标记（所有玩家统一） */
    .pawn-pole { opacity: .9; }
    .pawn-flag { transform-box: fill-box; transform-origin: 0% 50%; animation: pawnWave 2.4s ease-in-out infinite; }
    @keyframes pawnWave {
      0%, 100% { transform: rotate(-4deg); }
      50%      { transform: rotate(4deg); }
    }
    .pawn-tag { font-size: 11px; font-weight: 800; fill: var(--primary, #ff6b35); stroke: #fff; stroke-width: 2.5px; paint-order: stroke; }
    .pawn-other-tag { font-size: 9px; font-weight: 700; fill: #666; stroke: #fff; stroke-width: 2.5px; paint-order: stroke; }
    .city.shared .city-circle { fill: #fff3cd; stroke: #e0a800; }
    .city.secret .city-circle { stroke: #9b59b6; stroke-width: 3; stroke-dasharray: 3 2; }
    .board-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    /* head-right 里的按钮必须收掉全局 .btn 的 width:100%，否则竖着堆叠把头部撑到一百多像素；
       同时收掉 .btn.ghost 的 margin-top:10px，否则三个按钮比下拉框/计时器低 10px 不对齐 */
    .board-head .btn { width: auto; flex: 0 0 auto; margin: 0; }
    .head-right { display: flex; align-items: center; gap: 8px; }
    .turn-info { font-weight: 800; font-size: 16px; }
    .timer { background: #fff3cd; color: #8a6d00; padding: 6px 12px; border-radius: 999px; font-weight: 800; font-size: 13px; }
    .board {
      position: relative; width: 100%; aspect-ratio: 1000 / 720;
      background: linear-gradient(180deg, #d6ecff, #eaf6ff);
      border-radius: 16px; overflow: hidden; touch-action: none; /* 允许在地图上拖动平移 */
    }
    .board svg { width: 100%; height: 100%; display: block; }
    .head-right { display: flex; align-items: center; gap: 8px; }
    .btn.small { padding: 6px 12px; font-size: 13px; }
    /* 暗色夜视主题：背景与文字反色，线路/棋子颜色保持不变，清晰可读 */
    .board.dark { background: linear-gradient(180deg, #0f1b30, #0a1322); }
    .board.dark svg { background: #0f1d33; }
    .board.dark .land { fill: #16263f; stroke: #2c4a6e; }
    /* 线路保留各自的彩色描边（不覆盖 stroke），只提高亮度让深底下更醒目 */
    .board.dark .route { opacity: .9; }
    .board.dark .route.reach { filter: drop-shadow(0 0 6px rgba(255,179,0,.95)); }
    .board.dark .city-circle { stroke: #33425a; }
    .board.dark .city-label { fill: #e8eef6; stroke: #0a1322; }
    .board.dark .pawn-other-tag { fill: #cdd6e2; stroke: #0a1322; }
    /* 出发城市栏：单行紧凑（select 收掉全局 width:100%，否则整栏被撑到几十像素高） */
    .start-bar {
      display: flex; align-items: center; gap: 8px; margin-top: 8px;
      padding: 6px 10px; border-radius: 10px; background: #f2f7fc; font-size: 13px; font-weight: 700;
    }
    .start-bar select { width: auto; flex: 0 0 auto; padding: 5px 8px; font-size: 13px; }
    .start-bar .sbar-tip { font-size: 11px; color: var(--muted); font-weight: 400; }
    .action-bar {
      display: flex; gap: 12px; margin-top: 10px; flex-wrap: wrap;
      padding: 8px 0 2px; border-top: 1px dashed var(--line);
    }
    .action-bar .btn { width: auto; flex: 1; }
    .board-area { position: relative; flex: 1; min-height: 0; }
    /* 平面地图与球面的公共容器：占满 header 与按钮栏之间的全部空间
       （.board 自带 width:100% + aspect-ratio，绝对定位下会把高度撑回 1000:720 造成溢出，须一并覆盖） */
    .board-area .board, .board-area .globe {
      position: absolute; inset: 0; width: auto; height: auto; aspect-ratio: auto;
    }
    /* canvas 没有“内容高度”可撑，必须显式铺满（尺寸变化时由 JS 按 clientWidth/Height 重绘） */
    .board-area .globe { width: 100%; height: 100%; }
    /* three.js 贴图地球：与 2D 覆盖层同位置同尺寸，后者叠在上面画航线/城市/棋子 */
    .board-area .globe3d { position: absolute; inset: 0; width: 100%; height: 100%;
      border-radius: 14px; display: block; background: transparent; }
    /* 贴图地球模式下 2D 层只做覆盖，必须透明，否则会盖住底下的 WebGL */
    .board-area .globe.overlay { background: transparent; }
    /* 球面风格切换：只影响本机画面（写 localStorage，不下发给他人） */
    .globe-style {
      width: auto; padding: 5px 10px; font-size: 13px; font-weight: 700;
      border: 1.5px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink);
      margin-top: 0; align-self: center; height: auto;
    }
    /* 地图右上角工具区：只看卡 + 缩放；平面 / 球面共用同一位置与样式 */
    .map-tools {
      position: absolute; top: 10px; right: 10px; z-index: 7;
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .map-tools .tool-btn {
      width: 32px; height: 32px; margin: 0; padding: 0; border-radius: 10px;
      border: 1px solid #c9d6e4; background: rgba(255,255,255,.94); color: #243447;
      font-size: 15px; font-weight: 800; line-height: 1; cursor: pointer;
      box-shadow: 0 2px 8px rgba(31,43,61,.18);
      display: flex; align-items: center; justify-content: center;
    }
    .map-tools .tool-btn:hover { background: #fff; }
    .map-tools .tool-btn.filter-on { background: var(--primary, #ff6b35); color: #fff; border-color: var(--primary, #ff6b35); }
    .map-zoom {
      display: flex; flex-direction: column; align-items: center; gap: 6px;
    }
    .map-zoom .zbtn {
      width: 32px; height: 32px; border-radius: 10px; border: 1px solid #c9d6e4;
      background: rgba(255,255,255,.94); color: #243447; font-size: 18px; font-weight: 800;
      line-height: 1; cursor: pointer; box-shadow: 0 2px 8px rgba(31,43,61,.18);
      display: flex; align-items: center; justify-content: center; padding: 0;
    }
    .map-zoom .zbtn:hover { background: #fff; }
    .map-zoom .zbtn:active { transform: scale(.92); }
    .map-zoom .zbtn.star { font-size: 24px; }
    .map-zoom .ztag {
      font-size: 11px; font-weight: 700; color: #5b6c82;
      background: rgba(255,255,255,.88); border-radius: 999px; padding: 1px 7px;
    }
    .board-area.dark .map-tools .tool-btn {
      background: rgba(28,44,68,.95); color: #e8eef6; border-color: #3a5273;
    }
    .board-area.dark .map-zoom .zbtn {
      background: rgba(28,44,68,.95); color: #e8eef6; border-color: #3a5273;
    }
    .board-area.dark .map-zoom .ztag { background: rgba(20,34,54,.92); color: #c8d4e4; }
    .dice-area {
      position: absolute; right: 14px; bottom: 14px; z-index: 5;
      display: flex; gap: 10px; justify-content: flex-end; pointer-events: none;
    }
    .die {
      width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center;
      justify-content: center; font-weight: 800; color: #fff; box-shadow: var(--shadow); font-size: 14px;
    }
    .die.wild { background: #444; }

    .sidebar {
      display: flex; flex-direction: column; gap: 6px;
      min-height: 0; overflow: hidden;    /* 高度锁在一屏内，不出现外层滚动条 */
    }
    .sidebar .panel { padding: 8px 11px; min-height: 0; flex: 0 1 auto; overflow-y: auto; }
    /* 可折叠面板：点标题收起/展开（次要信息默认收起，保证聊天等区域有高度） */
    .sidebar .panel h3 { cursor: pointer; user-select: none; }
    .sidebar .panel h3::after { content: '▾'; float: right; color: var(--muted); font-size: 11px; }
    .sidebar .panel.collapsed h3::after { content: '▸'; }
    .sidebar .panel.collapsed > :not(h3) { display: none !important; }
    .sidebar .panel.collapsed > h3:not(:first-of-type) { display: none !important; }
    /* 内容放不下时面板内部滚动，但滚动条全部隐藏（滚轮/拖拽仍可滚动），界面保持无滚动条 */
    .sidebar .panel::-webkit-scrollbar { display: none; }
    .sidebar .panel { scrollbar-width: none; }
    .sidebar .panel h3 { margin: 0 0 6px; font-size: 13px; }
    .sidebar .tip { font-size: 11px; margin-top: 6px; }
    /* 可伸缩面板：聊天 / 护照 / 日志瓜分剩余高度；收起的面板不再参与分配。
       聊天有 min-height 保底：标题 + 消息区 + 输入行必须完整可见 */
    .sidebar .panel.grow { flex: 1 1 0; display: flex; flex-direction: column; }
    .sidebar .panel.collapsed { flex: 0 0 auto; }
    .sidebar .panel.grow#chatPanel { flex-grow: 3; min-height: 112px; overflow: hidden; }
    .sidebar .panel.grow .chat,
    .sidebar .panel.grow .log { flex: 1; min-height: 40px; max-height: none; }
    /* 侧栏加宽后用多列排布，信息全部摊开显示（不再为了省高度而压缩） */
    .sidebar .player-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 8px; }
    .sidebar .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); }
    .sidebar .tickets { display: flex; flex-wrap: wrap; }
    /* 侧栏加宽后可以显示完整信息，不再压缩字号（宽度够，信息不必折叠） */
    .sidebar #leaveBtn { padding: 8px 12px; font-size: 13px; margin-top: 0; }
    .panel { background: var(--panel); border-radius: 16px; padding: 12px; box-shadow: var(--shadow); flex-shrink: 0; }
    .panel h3 { margin: 0 0 8px; font-size: 14px; }
    .player-list { display: flex; flex-direction: column; gap: 8px; }
    .player {
      display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; padding: 8px 10px; border-radius: 12px;
      background: #f7fafd; border: 2px solid transparent;
    }
    .player .pcards { flex-basis: 100%; font-size: 12px; color: #555; }
    .player.current { border-color: var(--accent); background: #f0fff6; }
    .player .dot { width: 16px; height: 16px; border-radius: 50%; flex: none; }
    .player .pname { font-weight: 700; flex: 1; }
    .player .pscore { font-weight: 800; color: var(--primary-d); }
    .player .goal { font-size: 12px; color: var(--muted); }
    .player .offline { font-size: 11px; color: #b00; }
    .cards { display: flex; gap: 8px; flex-wrap: wrap; }
    .cardchip {
      background: #fff7e6; border: 1.5px solid #ffd591; border-radius: 12px;
      padding: 8px 10px; text-align: center; min-width: 64px; max-width: 136px;
    }
    .cardchip .ccity { font-weight: 800; font-size: 13px; line-height: 1.25; }
    .cardchip .cpts { font-size: 12px; color: var(--primary-d); font-weight: 700; }
    .cardchip.empty { color: var(--muted); border-style: dashed; background: #fafafa; }
    .cardchip { position: relative; text-align: center; }
    .cardchip .cno { font-size: 11px; color: #999; font-weight: 700; }
    .cardchip.secret { border-color: #9b59b6; background: #f6f0fb; }
    .cardchip.secret .ccity { color: #6b3fa0; }
    .cardchip.secret .cpts { color: #6b3fa0; }
    .pcard { font-size: 11px; color: #8e6bb0; white-space: nowrap; }
    .tickets { display: flex; gap: 6px; flex-wrap: wrap; }
    .ticket {
      display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 999px;
      background: #f2f6fb; font-weight: 800; font-size: 13px; border: 1.5px solid var(--line);
    }
    .ticket .swatch { width: 12px; height: 12px; border-radius: 3px; }
    .ticket.wild { background: #eee; }
    /* 房间聊天：消息区可滚动，输入行固定在下方 */
    .chat {
      max-height: 190px; overflow-y: auto; font-size: 13px; line-height: 1.5;
      display: flex; flex-direction: column; gap: 6px; padding-right: 2px;
    }
    .chat .msg {
      display: flex; align-items: flex-start; gap: 6px;
      padding: 5px 8px; border-radius: 10px; background: #f2f7fc; word-break: break-all;
    }
    .chat .msg.mine { background: #fff2ec; }
    .chat .msg .who { font-weight: 800; color: var(--ink); flex-shrink: 0; }
    .chat .msg .txt { color: #46566a; }
    .chat .msg .dot { width: 10px; height: 10px; border-radius: 50%; margin-top: 4px; flex-shrink: 0; }
    .chat .chat-empty { color: var(--muted); font-size: 12px; padding: 4px 2px; }
    .chat-send { display: flex; gap: 8px; margin-top: 8px; align-items: stretch; }
    /* 覆盖全局 input/select 的 width:100%，否则输入框会被按钮挤成一条缝 */
    .chat-send input { flex: 1 1 auto; width: auto; min-width: 0; font-size: 13px; padding: 8px 10px; }
    /* .btn 默认 width:100%，这里必须收掉，否则按钮会撑满整行把输入框挤没 */
    .chat-send .btn { margin-top: 0; flex: 0 0 auto; width: auto; padding: 8px 14px; font-size: 13px; }
    .log {
      max-height: 180px; overflow-y: auto; font-size: 13px; color: #46566a; line-height: 1.5;
      display: flex; flex-direction: column; gap: 4px;
    }
    .log div { padding: 2px 0; border-bottom: 1px dashed #eef2f7; }

    /* 线宽随缩放恒定：svg 根元素带 --zs = 当前倍率（renderBoard 里设置）。
       放大 N 倍时 1 个 SVG 单位 = N 屏幕像素，所以要用「除以」倍率，屏幕上线宽才不变 */
    .route { stroke-width: calc(1px / var(--zs, 1)); stroke-linecap: round; opacity: .55; }
    .route.reach { stroke-width: calc(2.4px / var(--zs, 1)); opacity: 1; filter: drop-shadow(0 0 3px #ffb300); }
    .city-node { cursor: default; }
    .city-circle { stroke: #fff; stroke-width: calc(2px / var(--zs, 1)); }
    .city-label { font-size: 11px; font-weight: 400; fill: #2c3e50; paint-order: stroke;
      stroke: #fff; stroke-width: 2.5px; pointer-events: none; }
    .city.reach .city-circle { stroke: #ffb300; stroke-width: calc(4px / var(--zs, 1)); cursor: pointer; }
    .city.shared .city-circle { stroke: #ff7a59; stroke-width: calc(4px / var(--zs, 1)); }
    .city.secret .city-circle { stroke: #2ecc71; stroke-width: calc(4px / var(--zs, 1)); stroke-dasharray: 4 3; }
    .toast {
      position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
      background: #2c3e50; color: #fff; padding: 10px 18px; border-radius: 999px;
      font-weight: 700; box-shadow: var(--shadow); z-index: 50;
    }
    /* 地图优先：宽度不足时侧边栏移到地图下方，并横向排布，保证地图尽量大 */
    @media (max-width: 1100px) {
      #game { grid-template-columns: 1fr; }
      .sidebar {
        display: grid; gap: 16px; align-items: start;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        position: static; max-height: none; overflow: visible; padding: 0;
      }
    }
    /* ---------- 城市知识卡：地理 / 历史 / 风土 + 知识问答 ---------- */
    .cmask {
      position: fixed; inset: 0; background: rgba(12, 20, 32, .55); z-index: 60;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .ccard {
      background: var(--panel); border-radius: 18px; box-shadow: var(--shadow);
      max-width: 540px; width: 100%; max-height: 88vh; overflow: auto; padding: 18px 20px;
    }
    .ccard h2 { margin: 0; font-size: 21px; }
    .ccard .csub { color: var(--muted); font-size: 13px; margin: 2px 0 12px; }
    .csec { border-top: 1px dashed var(--line); padding-top: 10px; margin-top: 10px; }
    .csec .lab { font-weight: 800; font-size: 13px; margin-bottom: 4px; }
    .csec p { margin: 0; font-size: 14px; line-height: 1.65; }
    .cfacts { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 14px; font-size: 13px; margin-top: 6px; }
    .quiz { margin-top: 12px; background: #fff8ec; border: 1px solid #f3d9a4; border-radius: 12px; padding: 12px; }
    /* ---------- 一局结束：战报 + 再来一局 ---------- */
    .end-board { margin: 14px 0 4px; display: flex; flex-direction: column; gap: 6px; }
    .end-row {
      display: flex; align-items: center; gap: 8px; padding: 8px 10px;
      border-radius: 10px; background: #f7f9fc; font-size: 14px;
    }
    .end-row.first { background: #fff7e6; border: 1.5px solid #ffd591; }
    .end-row .muted { color: var(--muted); font-size: 12px; margin-left: auto; }
    .end-actions { display: flex; gap: 10px; margin-top: 14px; }
    .end-actions .btn { flex: 1; margin-top: 0; }
    .quiz .qtitle { font-weight: 800; font-size: 14px; margin-bottom: 8px; }
    .quiz .opt {
      display: block; width: 100%; text-align: left; margin: 6px 0; padding: 9px 12px;
      border-radius: 10px; border: 1px solid var(--line); background: #fff;
      cursor: pointer; font-size: 14px; font-family: inherit;
    }
    .quiz .opt:hover { border-color: #f0a34a; background: #fff6e8; }
    .quiz .opt.right { background: #e8f8ee; border-color: #43c07a; font-weight: 700; }
    .quiz .opt.wrong { background: #fdecec; border-color: #e07070; }
    .quiz .why { margin-top: 8px; font-size: 13px; line-height: 1.6; }
    .cbtns { display: flex; gap: 10px; margin-top: 14px; }
    /* ---------- 护照：印章 / 奖章 / 历史时间轴 ---------- */
    .stampgrid { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 4px; }
    .stamp {
      font-size: 12px; padding: 3px 9px; border-radius: 999px; background: #eef4ff;
      border: 1px solid #cfe0f7; cursor: pointer;
    }
    .stamp:hover { background: #e2edff; }
    .medal {
      display: inline-block; font-size: 12px; padding: 3px 9px; border-radius: 999px;
      background: #fff3cd; border: 1px solid #e6c76a; margin: 2px 4px 2px 0;
    }
    .zone-line { font-size: 12px; color: var(--muted); margin: 8px 0 0; font-weight: 700; }
    .tl { font-size: 13px; margin-top: 4px; }
    .tl .row { display: flex; gap: 10px; padding: 3px 0; border-bottom: 1px dotted var(--line); }
    .tl .yr { font-weight: 800; min-width: 88px; color: var(--muted); }
    .pmetal { font-size: 11px; color: var(--muted); }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="logo">🏔️ 山河之旅</div>
    <div id="roomTag" class="room-tag hidden"></div>
  </header>

  <!-- 大厅 / 等待室 -->
  <main id="lobby" class="screen">
    <div class="card lobby-card">
      <h1 id="gameTitle">欢迎来到《山河之旅》</h1>
      <p class="subtitle" id="gameSubtitle">2-4 人 · 地理启蒙桌游</p>

      <label>服务器地址（留空 = 当前页面地址）
        <input id="serverInput" placeholder="例如：http://localhost:5000" />
      </label>

      <label>你的昵称
        <input id="nameInput" maxlength="12" placeholder="例如：小明" value="" />
      </label>

      <div class="row">
        <label>每回合
          <div class="static-field">掷 2 颗骰子（官方玩法）</div>
        </label>
        <label>回合超时（秒）
          <select id="timeoutSelect">
            <option value="20">20</option>
            <option value="30" selected>30</option>
            <option value="45">45</option>
            <option value="60">60</option>
          </select>
        </label>
      </div>

      <div class="row">
        <label>自定义房间号（可选）
          <input id="roomIdInput" maxlength="4" placeholder="留空随机" inputmode="numeric" />
        </label>
        <label>房间密码（可选）
          <input id="createPwdInput" maxlength="16" placeholder="留空无密码" />
        </label>
      </div>

      <div class="row">
        <label>总人数
          <select id="maxPlayersSelect"><!-- 2..10 由 JS 生成 --></select>
        </label>
        <label>机器人
          <select id="botCountSelect"><!-- 0..N-1 由 JS 生成 --></select>
        </label>
      </div>

      <label>机器人难度
        <select id="aiSelect">
          <option value="normal" selected>普通（会算路线、抢城市卡）</option>
          <option value="easy">简单（偶尔走错）</option>
        </select>
      </label>

      <!-- 开放规则：仅当该棋盘声明了可选项时才显示 -->
      <div class="row hidden" id="ruleRow">
        <label>目标分
          <select id="winScoreSelect"></select>
        </label>
        <label>每回合步数
          <select id="stepsSelect"></select>
        </label>
      </div>

      <!-- 出发城市：仅当该棋盘允许自选时才显示（默认 北京，可选 🎲 随机） -->
      <div class="row hidden" id="startRow">
        <label>出发城市
          <select id="startCitySelect"></select>
        </label>
      </div>

      <div class="btn-group">
        <button id="createBtn" class="btn primary">创建房间</button>
      </div>

      <hr/>

      <div class="room-list-box">
        <div class="room-list-head">
          <span>可加入的房间（等待中）</span>
          <button id="refreshRoomsBtn" class="btn tiny">刷新</button>
        </div>
        <div id="roomList" class="room-list"><div class="room-empty">加载中…</div></div>
      </div>

      <hr/>

      <input id="roomInput" type="hidden" />

      <div id="joinPrompt" class="rejoin-box hidden">
        <p>房间 <b id="joinPromptRoom"></b> 需要密码：</p>
        <input id="joinPwdInput" maxlength="16" placeholder="请输入房间密码" />
        <div class="btn-group">
          <button id="joinPwdBtn" class="btn primary">加入房间</button>
          <button id="cancelJoinBtn" class="btn ghost">取消</button>
        </div>
      </div>

      <div id="rejoinBox" class="rejoin-box hidden">
        <p>检测到你上局未完成，可一键回到游戏：</p>
        <button id="rejoinBtn" class="btn primary">回到游戏</button>
      </div>
    </div>

    <div id="lobbyMsg" class="msg hidden"></div>
  </main>

  <div id="connBadge" class="conn-badge init">● 正在连接服务器…</div>

  <!-- 游戏室 -->
  <main id="game" class="screen hidden">
    <section class="board-wrap">
      <div class="board-head">
        <span id="turnInfo" class="turn-info">准备中…</span>
        <span class="head-right">
          <button id="viewBtn" class="btn ghost small hidden" title="切换平面地图 / 球面地球">🗺 平面</button>
          <select id="globeStyleSel" class="globe-style hidden"
                  title="球面风格（只影响你自己的画面，不影响其他玩家）">
            <option value="real">🌏 写实地球</option>
            <option value="night">🌌 星空夜景</option>
            <option value="carto">🎨 明亮卡通</option>
          </select>
          <button id="themeBtn" class="btn ghost small" title="切换主题（亮色 / 暗色）">🌞 亮色</button>
          <span id="timerInfo" class="timer hidden"></span>
        </span>
      </div>
      <div class="board-area">
        <div id="board" class="board"></div>
        <!-- 球面：three.js 贴图地球（WebGL，在下） + 航线/城市/棋子的 2D 覆盖层（在上） -->
        <canvas id="globe3d" class="globe3d hidden"></canvas>
        <canvas id="globe" class="globe hidden"></canvas>
        <div class="map-tools">
          <button id="cardOnlyBtn" class="tool-btn hidden" title="只看城市卡上的城市（再点还原全部城市）">👁</button>
          <div id="mapZoom" class="map-zoom">
            <button id="zoomInBtn" class="zbtn" title="放大地图">+</button>
            <button id="zoomOutBtn" class="zbtn" title="缩小地图">−</button>
            <button id="zoomMeBtn" class="zbtn star" title="回到我所在的位置">*</button>
            <span id="zoomTag" class="ztag">1.0×</span>
          </div>
        </div>
        <div id="diceArea" class="dice-area"></div>
      </div>
      <div id="moveHint" class="move-hint hidden"></div>
      <div id="startCityBar" class="start-bar hidden">
        <span>🛫 出发城市</span>
        <select id="startCitySelect2"></select>
        <span id="startCityTag" class="sbar-tip"></span>
      </div>
      <div class="action-bar">
        <button id="addBotBtn" class="btn hidden">🤖 添加机器人</button>
        <button id="removeBotBtn" class="btn ghost hidden">移除机器人</button>
        <button id="startBtn" class="btn primary hidden">开始游戏</button>
        <button id="rollBtn" class="btn primary hidden">🎲 掷骰子</button>
        <button id="endBtn" class="btn hidden">结束回合</button>
      </div>
    </section>

    <aside class="sidebar">
      <div class="panel">
        <h3>玩家</h3>
        <div id="playerList" class="player-list"></div>
      </div>
      <div class="panel grow" id="chatPanel">
        <h3>💬 房间聊天</h3>
        <div id="chatBox" class="chat"></div>
        <div class="chat-send">
          <input id="chatInput" type="text" maxlength="200" autocomplete="off"
                 placeholder="聊点什么…（回车发送）">
          <button id="chatSendBtn" class="btn primary small">发送</button>
        </div>
        <p class="tip">房间内所有人可见，单条最多 200 字。</p>
      </div>
      <div class="panel">
        <h3 id="cardsTitle">城市卡</h3>
        <div id="sharedCards" class="cards"></div>
        <p class="tip">①②③ 为<b>公共卡</b>，所有人可见——只有本回合移动后<b>停留的城市</b>与卡面相同，才能获得该卡分数（取走后翻开新卡）。<br/>④ 为你的<b>秘密目的地</b>，只有你自己看得到；别人只能看到一张背面 🎴。</p>
      </div>
      <div class="panel">
        <h3>我的车票</h3>
        <div id="ticketBox" class="tickets"></div>
      </div>
      <div class="panel grow hidden" id="passportPanel">
        <h3>🛂 我的护照</h3>
        <div id="passportBox"></div>
        <div id="medalBox"></div>
        <h3 style="margin-top:14px">🕰 我的历史时间轴</h3>
        <div id="timelineBox" class="tl"></div>
        <p class="tip" id="quizStat"></p>
      </div>
      <div class="panel grow" id="logPanel">
        <h3>游戏日志</h3>
        <div id="logBox" class="log"></div>
      </div>
      <button id="leaveBtn" class="btn ghost">退出房间</button>
    </aside>
  </main>

  <div id="cityModal" class="cmask hidden"><div class="ccard" id="cityCard"></div></div>

  <!-- 一局结束：战报 + 询问再来一局 -->
  <div id="endMask" class="cmask hidden">
    <div class="ccard">
      <h2 id="endTitle">🎉 游戏结束</h2>
      <div class="csub">本局战报（按得分排名）</div>
      <div id="endBoard" class="end-board"></div>
      <div class="end-actions">
        <button id="rematchBtn" class="btn primary">🔁 再来一局</button>
        <button id="endLeaveBtn" class="btn ghost">🏠 退出房间</button>
      </div>
      <div id="endWait" class="tip hidden"></div>
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script>

  </script>
  <script src="/static/vendor/three.min.js"></script>
  <script>
    /* 应用逻辑（内联，避免代理拦截外部 js/css） */
    function startApp() {
      // 当前棋种由路径 /g/<game_id>/ 决定：同一套客户端服务所有棋
      const GAME_ID = (location.pathname.match(/^\/g\/([A-Za-z0-9_-]+)/) || [null, 'shanhe'])[1];
      const STORE_KEY = GAME_ID + '_trip';
      const SERVER_KEY = GAME_ID + '_trip_server';
      const VIEW_KEY = GAME_ID + '_view';
      const CARD_KEY = GAME_ID + '_card_only';    // "只看城市卡的城市"开关（平面 / 球面共用）
      let socket = null;
      let MAP = null;
      let ADJ = {};
      let POS = {};          // 城市投影坐标 {name:{x,y}}（平面视图用）
      let LAND_PATHS = [];   // 陆地轮廓 SVG 路径（平面视图，可含多个多边形）
      let GAME_SPEC = null;  // 该棋元信息：可用视图、可选规则
      let viewMode = 'flat'; // flat=平面地图 | globe=可旋转球面
      let cardOnly = false;  // 开启后地图上只显示城市卡上的城市（两个视图共用）
      let state = null;
      let myPid = null;
      let myRoom = null;
      let joined = false;
      let timerLeft = 0;
      let timerInt = null;
      let CITY_INFO = {};        // 城市知识库（地理/历史/风土/问答），由地图接口下发
      let lastQuizCity = null;   // 已经弹过的知识题城市，避免重复打扰
      // 平面视图的"镜头"：SVG 的 viewBox（x, y, 宽, 高），缩放=缩小视野，平移=移动视野
      const VW = 1000, VH = 720;
      let view = { x: 0, y: 0, w: VW, h: VH };
      let panned = false;        // 刚刚拖动过地图，这一下 click 不当作"点城市"

      const $ = (id) => document.getElementById(id);
      const lobby = $('lobby'), game = $('game');
      const lobbyMsg = $('lobbyMsg');
      const connBadge = $('connBadge');

      function showScreen(name) {
        lobby.classList.toggle('hidden', name !== 'lobby');
        game.classList.toggle('hidden', name !== 'game');
        // 进入游戏界面时锁定整页为一屏（配合 body.in-game 的 CSS）
        document.body.classList.toggle('in-game', name === 'game');
      }
      function toast(msg) {
        const t = $('toast');
        t.textContent = msg;
        t.classList.remove('hidden');
        clearTimeout(toast._t);
        toast._t = setTimeout(() => t.classList.add('hidden'), 2200);
      }
      // 车票只有 5 色，第 6 人起由服务端分配下列额外的「玩家身份色」（不参与车票/线路）
      const EXTRA_PLAYER_COLORS = {
        orange: { hex: '#e67e22', name: '橙' }, teal: { hex: '#16a085', name: '青' },
        pink: { hex: '#e84393', name: '粉' }, brown: { hex: '#8d6e63', name: '棕' },
        slate: { hex: '#546e7a', name: '灰蓝' }
      };
      function colorHex(c) {
        if (c === 'go') return '#444';
        return (MAP.colors[c] && MAP.colors[c].hex) || (EXTRA_PLAYER_COLORS[c] && EXTRA_PLAYER_COLORS[c].hex) || '#999';
      }
      function colorName(c) {
        if (c === 'go') return 'GO';
        return (MAP.colors[c] && MAP.colors[c].name) || (EXTRA_PLAYER_COLORS[c] && EXTRA_PLAYER_COLORS[c].name) || c;
      }
      function me() {
        if (!state || !myPid) return null;
        return state.players.find((p) => p.pid === myPid) || null;
      }

      function serverBase() {
        let b = '';
        const el = $('serverInput');
        if (el && el.value.trim()) b = el.value.trim();
        else { try { b = localStorage.getItem(SERVER_KEY) || ''; } catch (e) {} }
        return b.trim().replace(/\/+$/, '');
      }
      function saveBase() {
        try { localStorage.setItem(SERVER_KEY, serverBase()); } catch (e) {}
      }

      async function loadMap() {
        const base = serverBase();
        const ctrl = new AbortController();
        const t = setTimeout(function () { ctrl.abort(); }, 5000);
        let res;
        try {
          // 每个棋种有自己的地图接口（服务端已算好投影，前端只管画）
          res = await fetch(base + '/g/' + GAME_ID + '/api/map', { signal: ctrl.signal });
        } finally {
          clearTimeout(t);
        }
        if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + (res.statusText || ''));
        MAP = await res.json();
        CITY_INFO = MAP.city_info || {};
        ADJ = {}; POS = {};
        MAP.cities.forEach(function (c) {
          ADJ[c.name] = [];
          POS[c.name] = { x: c.x, y: c.y };   // 服务端已投影好的画布坐标
        });
        MAP.routes.forEach(function (r) {
          const a = r[0], b = r[1], color = r[2], cost = r[3];
          ADJ[a].push({ to: b, color: color, cost: cost });
          ADJ[b].push({ to: a, color: color, cost: cost });
        });
        // 陆地轮廓（可能由多个多边形组成：大陆 + 岛屿）
        LAND_PATHS = (MAP.land || []).map(function (poly) {
          return poly.map(function (p, i) {
            return (i ? 'L' : 'M') + p[0] + ' ' + p[1];
          }).join(' ') + ' Z';
        });
        placeLabels();
        buildGlobeDots();
        // 地图就绪后才能填出"城市列表"版的出发城市下拉
        fillStartCitySelects(GAME_SPEC && GAME_SPEC.options ? GAME_SPEC.options.start_city : null);
      }

      // 载入该棋的元信息（名称 / 可用视图 / 可选规则）
      async function loadGameSpec() {
        try {
          const res = await fetch(serverBase() + '/api/games');
          if (!res.ok) return;
          const data = await res.json();
          GAME_SPEC = (data.games || []).find((g) => g.id === GAME_ID) || null;
        } catch (e) { /* 元信息拿不到时按默认（平面视图、默认规则）继续 */ }
        applyGameSpec();
      }

      function applyGameSpec() {
        if (!GAME_SPEC) return;
        const t = $('gameTitle'), s = $('gameSubtitle');
        if (t) t.textContent = '欢迎来到《' + GAME_SPEC.name + '》';
        if (s) s.textContent = (GAME_SPEC.tags || []).join(' · ') + ' · ' + GAME_SPEC.desc;
        document.title = GAME_SPEC.name;
        // 支持球面的棋盘才显示切换按钮
        const views = GAME_SPEC.views || ['flat'];
        const vb = $('viewBtn');
        if (vb) {
          if (views.indexOf('globe') >= 0) vb.classList.remove('hidden');
          else { vb.classList.add('hidden'); viewMode = 'flat'; }
        }
        // 开放规则（目标分 / 每回合步数）
        const opts = GAME_SPEC.options || {};
        const row = $('ruleRow');
        const fill = function (sel, values) {
          if (!values || !values.length) return false;
          sel.innerHTML = values.map(function (v, i) {
            return '<option value="' + v + '"' + (i === 0 ? ' selected' : '') + '>' + v + '</option>';
          }).join('');
          return true;
        };
        let shown = false;
        if (row) {
          const a = fill($('winScoreSelect'), opts.win_score);
          const b = fill($('stepsSelect'), opts.steps_per_turn);
          shown = a || b;
          row.classList.toggle('hidden', !shown);
          if (!a) row.querySelector('#winScoreSelect').closest('label').classList.add('hidden');
          if (!b) row.querySelector('#stepsSelect').closest('label').classList.add('hidden');
        }
        fillStartCitySelects(opts.start_city);
      }

      // ---------- 出发城市：房主可选 / 🎲 随机 ----------
      function startCityOptions(spec) {
        // spec 形如 ['cities', 'random']：'cities'=城市列表，'random'=随机项
        if (!spec || spec.indexOf('random') < 0 && spec.indexOf('cities') < 0) return null;
        const opts = [];
        if (spec.indexOf('random') >= 0) opts.push({ v: 'random', t: '🎲 随机（开局揭晓）' });
        if (spec.indexOf('cities') >= 0 && MAP && MAP.cities) {
          MAP.cities.forEach(function (c) { opts.push({ v: c.name, t: c.name }); });
        }
        return opts.length ? opts : null;
      }

      function fillStartCitySelects(spec) {
        const opts = startCityOptions(spec);
        ['startCitySelect', 'startCitySelect2'].forEach(function (id) {
          const sel = $(id);
          if (!sel) return;
          if (!opts) { sel.closest('.row, .start-bar').classList.add('hidden'); return; }
          sel.innerHTML = opts.map(function (o) {
            return '<option value="' + o.v + '"' + (o.v === (MAP.start || '北京') ? ' selected' : '') + '>' +
              esc(o.t) + '</option>';
          }).join('');
        });
        const row = $('startRow');
        if (row) row.classList.toggle('hidden', !opts);
        const bar = $('startCityBar');
        if (bar) bar.classList.toggle('hidden', !opts);
      }

      // 城市名标签避让：为每座城市挑一个不与已有标签重叠的位置
      function placeLabels() {
        // 个别城市的标签位置手工指定，优先于自动避让
        const overrides = {
          '敦煌': { dx: -13, dy: 4, anchor: 'end' },  // 放到城市点左侧，避开三线交汇处
          '洛阳': { dx: -13, dy: 4, anchor: 'end' },  // 郑州以西
          '苏州': { dx: 0, dy: 20, anchor: 'middle' }, // 沪宁之间，放下方
          '遵义': { dx: 14, dy: 4, anchor: 'start' },  // 贵阳以北，放右侧
          '大理': { dx: -13, dy: 4, anchor: 'end' },  // 丽江以南、昆明以西
          '呼伦贝尔': { dx: -13, dy: 4, anchor: 'end' }, // 哈尔滨西北
        };
        const opts = [
          { dx: 0, dy: -12, anchor: 'middle' },
          { dx: 0, dy: 20, anchor: 'middle' },
          { dx: 14, dy: 4, anchor: 'start' },
          { dx: -14, dy: 4, anchor: 'end' },
          { dx: 0, dy: -26, anchor: 'middle' },
          { dx: 0, dy: 34, anchor: 'middle' },
        ];
        const placed = [];
        Object.keys(POS).sort((a, b) => POS[a].y - POS[b].y).forEach(function (name) {
          const p = POS[name];
          const list = overrides[name] ? [overrides[name]].concat(opts) : opts;
          for (let i = 0; i < list.length; i++) {
            const o = list[i];
            const lx = p.x + o.dx, ly = p.y + o.dy;
            const clash = placed.some(function (q) {
              return Math.abs(q.x - lx) < 44 && Math.abs(q.y - ly) < 15;
            });
            if (!clash) {
              p.lx = lx; p.ly = ly; p.anchor = o.anchor;
              placed.push({ x: lx, y: ly });
              return;
            }
          }
          p.lx = p.x; p.ly = p.y - 12; p.anchor = 'middle';
          placed.push({ x: p.x, y: p.y - 12 });
        });
      }

      // ---------- 球面视图：Canvas 2D 正交投影（零依赖、可拖拽旋转）----------
      // 说明：不引 three.js / d3 是为了离线可用（CDN 拉不到时会白屏），
      // 而正交投影 + 点阵大陆 + 大圆弧航线已足够呈现立体地球。
      // 球面默认静止：不自动旋转，只有拖拽（含松手后的短惯性）与滚轮缩放会改变视角
      const GLOBE = { yaw: 2.0, pitch: 0.4, drag: false, moved: 0, lx: 0, ly: 0,
                      dots: [], stars: null, raf: 0, cx: 0, cy: 0, r: 0,
                      init: false, zoom: 1, vy: 0, dirty: true };

      // 星空背景（固定随机，避免每帧闪烁；仅暗色主题绘制）
      function drawStars(ctx, w, h, dark) {
        if (!dark) return;
        if (!GLOBE.stars) {
          GLOBE.stars = [];
          let seed = 20240921;
          const rnd = function () { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
          for (let i = 0; i < 160; i++) GLOBE.stars.push([rnd(), rnd(), rnd()]);
        }
        ctx.fillStyle = '#ffffff';
        for (let i = 0; i < GLOBE.stars.length; i++) {
          const s = GLOBE.stars[i];
          ctx.globalAlpha = 0.2 + s[2] * 0.55;
          ctx.fillRect(s[0] * w, s[1] * h, 1.5, 1.5);
        }
        ctx.globalAlpha = 1;
      }

      // ---------- 球面风格：three.js 贴图地球（写实 / 星空夜景 / 明亮卡通）----------
      // 三种风格只影响本机画面（存 localStorage，不下发给服务端），每个玩家可各看各的。
      // three.js 没加载成功或 WebGL 不可用时，自动回退到下面的 Canvas 2D 地球（点阵大陆）。
      const GLOBE_STYLE_KEY = 'shanhe_globe_style';
      let globeStyle = 'real';
      try { globeStyle = localStorage.getItem(GLOBE_STYLE_KEY) || 'real'; } catch (e) {}
      const TEX = {};          // 贴图缓存
      let LAND_WORLD = null;   // 真实海岸线（卡通贴图用，按需拉取一次）

      function texUrl(f) { return '/static/textures/' + f; }

      // three 球体的 u=0 落在经度 -90°，而标准等距圆柱贴图（u=(lon+180)/360）
      // 要把贴图整体右移 90°（offset +0.25）才能和城市经纬度对上，否则城市会偏 90° 经度
      const TEX_U_OFFSET = 0.25;
      function fixEquirectUV(t) {
        t.wrapS = THREE.RepeatWrapping;
        t.offset.x = TEX_U_OFFSET;
        return t;
      }

      function loadTex(name, file, srgb) {
        if (TEX[name]) return TEX[name];
        const t = new THREE.TextureLoader().load(texUrl(file), function () {
          GLOBE.dirty = true; startGlobeLoop();          // 贴图到位后补一帧
        });
        if (srgb && THREE.SRGBColorSpace) t.colorSpace = THREE.SRGBColorSpace;
        t.anisotropy = 4;
        fixEquirectUV(t);
        TEX[name] = t;
        return t;
      }

      // 只用一次大气辉光材质：菲涅尔边缘光，让球体边缘亮起来（三种风格共用，参数不同）
      function makeAtmosphere() {
        return new THREE.ShaderMaterial({
          uniforms: { uColor: { value: new THREE.Color(0x7fc4ff) },
                      uStrength: { value: 0.85 }, uPower: { value: 2.6 } },
          vertexShader: 'varying vec3 vN; varying vec3 vP;' +
            'void main(){ vN = normalize(normalMatrix * normal);' +
            ' vec4 mv = modelViewMatrix * vec4(position, 1.0); vP = mv.xyz;' +
            ' gl_Position = projectionMatrix * mv; }',
          fragmentShader: 'uniform vec3 uColor; uniform float uStrength; uniform float uPower;' +
            'varying vec3 vN; varying vec3 vP;' +
            'void main(){ float f = pow(1.0 - abs(dot(normalize(vN), normalize(-vP))), uPower);' +
            ' gl_FragColor = vec4(uColor, clamp(f, 0.0, 1.0) * uStrength); }',
          transparent: true, blending: THREE.AdditiveBlending,
          side: THREE.BackSide, depthWrite: false
        });
      }

      function ensureGlobe3D() {
        if (GLOBE.threeFailed) return false;
        if (GLOBE.threeReady) return true;
        if (typeof window.THREE === 'undefined') { GLOBE.threeFailed = true; return false; }
        const cvs = $('globe3d');
        if (!cvs) { GLOBE.threeFailed = true; return false; }
        try {
          GLOBE.renderer = new THREE.WebGLRenderer({ canvas: cvs, alpha: true, antialias: true });
        } catch (e) {
          GLOBE.threeFailed = true;                       // 无 WebGL：继续用 2D 地球
          return false;
        }
        GLOBE.renderer.setPixelRatio(Math.min(2, window.devicePixelRatio || 1));
        GLOBE.scene = new THREE.Scene();
        // 正交相机 + 像素级视锥：球半径 R 直接等于屏幕上的 R 像素，与 2D 覆盖层严格对齐
        GLOBE.camera = new THREE.OrthographicCamera(-1, 1, 1, -1, -2000, 2000);
        GLOBE.camera.position.z = 800;
        GLOBE.amb = new THREE.AmbientLight(0xffffff, 0.45);
        const dir = new THREE.DirectionalLight(0xffffff, 1);
        dir.position.set(-0.5, 0.6, 1);                   // 主光源固定在左上（屏幕空间）
        GLOBE.light = dir;
        GLOBE.scene.add(GLOBE.amb, dir);
        GLOBE.root = new THREE.Group();                   // 地球 + 大气一起缩放/平移
        GLOBE.earth = new THREE.Mesh(new THREE.SphereGeometry(1, 96, 64),
                                     new THREE.MeshPhongMaterial({ color: 0xbfe0f5 }));
        GLOBE.atm = new THREE.Mesh(new THREE.SphereGeometry(1.16, 64, 48), makeAtmosphere());
        GLOBE.root.add(GLOBE.earth, GLOBE.atm);
        GLOBE.scene.add(GLOBE.root);
        GLOBE.threeReady = true;
        applyGlobeStyle(globeStyle);
        return true;
      }

      function applyGlobeStyle(st) {
        globeStyle = st || globeStyle;
        try { localStorage.setItem(GLOBE_STYLE_KEY, globeStyle); } catch (e) {}
        if (!ensureGlobe3D()) return;                     // 回退模式：风格切换不生效
        const earth = GLOBE.earth, uni = GLOBE.atm.material.uniforms;
        GLOBE.scene.background = null;
        GLOBE.amb.intensity = 0.75; GLOBE.light.intensity = 1.8;
        GLOBE.atm.visible = true;
        uni.uColor.value.set(0x7fc4ff); uni.uStrength.value = 0.85;
        if (globeStyle === 'real') {
          // 写实：NASA 蓝色弹珠日面图 + 地形凹凸 + 海洋高光
          earth.material = new THREE.MeshPhongMaterial({
            map: loadTex('marble', 'earth-blue-marble.jpg', true),
            bumpMap: loadTex('topo', 'earth-topology.png', false),
            bumpScale: 0.12,
            specularMap: loadTex('water', 'earth-water.png', false),
            specular: new THREE.Color(0x2b3d4f), shininess: 14
          });
        } else if (globeStyle === 'night') {
          // 夜景：城市灯光贴图（自发光）+ 星空背景，大气更亮
          earth.material = new THREE.MeshBasicMaterial({
            map: loadTex('night', 'earth-night.jpg', true)
          });
          GLOBE.scene.background = loadTex('sky', 'night-sky.png', true);
          uni.uColor.value.set(0x5aa6ff); uni.uStrength.value = 1.15;
        } else {
          // 卡通：用真实海岸线现画一张扁平贴图（等距圆柱投影），明亮清爽
          earth.material = new THREE.MeshLambertMaterial({ color: 0xd9eefb });
          // r160 物理光照单位偏暗，卡通要「明亮扁平」就得给足环境光
          GLOBE.amb.intensity = 2.1; GLOBE.light.intensity = 0.55;
          uni.uColor.value.set(0x9ad4ff); uni.uStrength.value = 0.5;
          ensureCartoTexture(function (tex) {
            if (globeStyle !== 'carto') return;
            earth.material.map = tex; earth.material.color.set(0xffffff);
            earth.material.needsUpdate = true;
            GLOBE.dirty = true; startGlobeLoop();
          });
        }
        GLOBE.dirty = true; startGlobeLoop();
      }

      // 卡通贴图：海洋浅蓝 + 真实海岸线陆地 + 经纬网，等距圆柱投影 2048×1024
      function buildCartoTexture(polys) {
        const W = 2048, H = 1024;
        const c = document.createElement('canvas');
        c.width = W; c.height = H;
        const g = c.getContext('2d');
        g.fillStyle = '#d9eefb'; g.fillRect(0, 0, W, H);
        // 极地冰盖
        const ice = g.createLinearGradient(0, 0, 0, H);
        ice.addColorStop(0, 'rgba(255,255,255,.95)');
        ice.addColorStop(0.10, 'rgba(255,255,255,0)');
        ice.addColorStop(0.90, 'rgba(255,255,255,0)');
        ice.addColorStop(1, 'rgba(255,255,255,.95)');
        g.fillStyle = ice; g.fillRect(0, 0, W, H);
        // 经纬网
        g.strokeStyle = 'rgba(90,130,160,.22)'; g.lineWidth = 1.5;
        for (let lon = -180; lon <= 180; lon += 30) {
          const x = (lon + 180) / 360 * W;
          g.beginPath(); g.moveTo(x, 0); g.lineTo(x, H); g.stroke();
        }
        for (let lat = -60; lat <= 60; lat += 30) {
          const y = (90 - lat) / 180 * H;
          g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke();
        }
        // 陆地：真实海岸线（lon/lat → 等距圆柱像素）
        g.fillStyle = '#a9d98a'; g.strokeStyle = '#5f8f4e'; g.lineWidth = 2.5;
        polys.forEach(function (poly) {
          g.beginPath();
          poly.forEach(function (p, i) {
            const x = (p[0] + 180) / 360 * W, y = (90 - p[1]) / 180 * H;
            if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
          });
          g.closePath(); g.fill(); g.stroke();
        });
        const t = new THREE.CanvasTexture(c);
        if (THREE.SRGBColorSpace) t.colorSpace = THREE.SRGBColorSpace;
        t.anisotropy = 4;
        fixEquirectUV(t);
        return t;
      }

      function ensureCartoTexture(cb) {
        if (TEX.carto) { cb(TEX.carto); return; }
        if (LAND_WORLD) { TEX.carto = buildCartoTexture(LAND_WORLD); cb(TEX.carto); return; }
        fetch('/static/data/land.json').then(function (r) { return r.json(); })
          .then(function (polys) {
            LAND_WORLD = polys;
            TEX.carto = buildCartoTexture(polys);
            cb(TEX.carto);
          }).catch(function () { /* 拿不到就用纯色球 */ });
      }

      // 每帧：把当前视角同步给 three.js（与 2D 覆盖层共用 cx/cy/R）
      function renderGlobe3D(w, h, cx, cy, R) {
        const rd = GLOBE.renderer, cam = GLOBE.camera;
        rd.setSize(w, h, false);
        cam.left = -w / 2; cam.right = w / 2; cam.top = h / 2; cam.bottom = -h / 2;
        cam.updateProjectionMatrix();
        GLOBE.root.position.set(cx - w / 2, h / 2 - cy, 0);   // 屏幕坐标 → 世界坐标
        GLOBE.root.scale.setScalar(R);
        // 与 2D 的 rotateVec 对齐：先绕 Y 转 yaw，再绕 X 转 pitch。
        // 注意符号：three 的 Ry 是右手系（+z→+x），而 rotateVec 用的是相反方向，故取 -yaw
        GLOBE.earth.rotation.set(GLOBE.pitch, -GLOBE.yaw, 0);
        rd.render(GLOBE.scene, cam);
      }

      // 初始视角对准出发城市：可证明 yaw=经度、pitch=纬度 时该点正好落在球心
      function centerGlobeOn(city) {
        if (GLOBE.init || !MAP || !MAP.geo || !city || !MAP.geo[city]) return;
        const g0 = MAP.geo[city];
        GLOBE.yaw = g0[0] * Math.PI / 180;
        GLOBE.pitch = g0[1] * Math.PI / 180;
        GLOBE.init = true;
      }

      // 房间出发城市变了（房主指定 / 随机揭晓）就重新对准球面，保证与平面一致
      function syncGlobeStart() {
        const sc = currentStartCity();
        if (!sc || GLOBE.startCity === sc) return;
        GLOBE.startCity = sc;
        GLOBE.init = false;
        centerGlobeOn(sc);
        GLOBE.dirty = true;
      }

      function lonLatVec(lon, lat) {
        const a = lat * Math.PI / 180, o = lon * Math.PI / 180;
        return [Math.cos(a) * Math.sin(o), Math.sin(a), Math.cos(a) * Math.cos(o)];
      }
      function rotateVec(v, yaw, pitch) {
        const cy = Math.cos(yaw), sy = Math.sin(yaw);
        const x = v[0] * cy - v[2] * sy, z0 = v[0] * sy + v[2] * cy, y = v[1];
        const cp = Math.cos(pitch), sp = Math.sin(pitch);
        return [x, y * cp - z0 * sp, y * sp + z0 * cp];
      }
      function projectVec(lon, lat) {
        const v = rotateVec(lonLatVec(lon, lat), GLOBE.yaw, GLOBE.pitch);
        return { x: v[0], y: -v[1], z: v[2] };   // 屏幕 y 轴向下
      }
      function pointInPoly(x, y, poly) {
        let inside = false;
        for (let i = 0, j = poly.length - 1; i < poly.length; j = i++) {
          const xi = poly[i][0], yi = poly[i][1], xj = poly[j][0], yj = poly[j][1];
          if (((yi > y) !== (yj > y)) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
        }
        return inside;
      }
      // 预计算陆地点阵：经纬度固定，旋转时只需重新投影，省去每帧的多边形裁剪
      function buildGlobeDots() {
        if (!MAP || GLOBE.dots.length) return;
        centerGlobeOn(currentStartCity());
        const polys = MAP.land_geo || [];
        if (!polys.length) return;
        const box = polys.map(function (p) {
          let a = 180, b = -180, c = 90, d = -90;
          p.forEach(function (q) {
            a = Math.min(a, q[0]); b = Math.max(b, q[0]);
            c = Math.min(c, q[1]); d = Math.max(d, q[1]);
          });
          return [a, b, c, d];
        });
        for (let lat = -58; lat <= 78; lat += 2) {
          // 高纬度处经度方向按比例稀疏，避免极点附近点阵过密（保持视觉均匀）
          const stepLon = 2 / Math.max(0.15, Math.cos(lat * Math.PI / 180));
          for (let lon = -180; lon < 180; lon += stepLon) {
            for (let i = 0; i < polys.length; i++) {
              const bx = box[i];
              if (lon < bx[0] || lon > bx[1] || lat < bx[2] || lat > bx[3]) continue;
              if (pointInPoly(lon, lat, polys[i])) { GLOBE.dots.push([lon, lat]); break; }
            }
          }
        }
      }
      // 大圆航线采样（球面最短路径）
      function greatCircle(a, b, n) {
        const va = lonLatVec(a[0], a[1]), vb = lonLatVec(b[0], b[1]);
        let d = va[0] * vb[0] + va[1] * vb[1] + va[2] * vb[2];
        d = Math.max(-1, Math.min(1, d));
        const om = Math.acos(d), so = Math.sin(om), out = [];
        for (let i = 0; i <= n; i++) {
          const t = i / n;
          let s1, s2;
          if (so < 1e-6) { s1 = 1 - t; s2 = t; }
          else { s1 = Math.sin((1 - t) * om) / so; s2 = Math.sin(t * om) / so; }
          out.push([s1 * va[0] + s2 * vb[0], s1 * va[1] + s2 * vb[1], s1 * va[2] + s2 * vb[2]]);
        }
        return out;
      }
      // 只画朝向观察者的部分（z>0），自动处理地平线遮挡
      function strokePath3D(ctx, cx, cy, R, pts3) {
        ctx.beginPath();
        let started = false;
        for (let i = 0; i < pts3.length; i++) {
          const v = rotateVec(pts3[i], GLOBE.yaw, GLOBE.pitch);
          if (v[2] <= 0) { started = false; continue; }
          const x = cx + v[0] * R, y = cy - v[1] * R;
          if (!started) { ctx.moveTo(x, y); started = true; } else ctx.lineTo(x, y);
        }
        ctx.stroke();
      }
      function drawCurve(ctx, cx, cy, R, fn) {
        const pts = [];
        for (let i = 0; i <= 48; i++) pts.push(fn(i / 48));
        strokePath3D(ctx, cx, cy, R, pts.map(function (p) {
          return lonLatVec(p.lon, p.lat);
        }));
      }

      function renderGlobe() {
        const cv = $('globe');
        if (!cv || !MAP) return;
        const dpr = window.devicePixelRatio || 1;
        const w = cv.clientWidth || 900, h = cv.clientHeight || 648;
        if (cv.width !== Math.round(w * dpr) || cv.height !== Math.round(h * dpr)) {
          cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
        }
        const ctx = cv.getContext('2d');
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        ctx.clearRect(0, 0, w, h);
        const cx = w / 2, cy = h / 2, R = Math.min(w, h) * 0.43 * (GLOBE.zoom || 1);
        GLOBE.cx = cx; GLOBE.cy = cy; GLOBE.r = R;
        const dark = $('board').classList.contains('dark');

        // 贴图地球（WebGL）可用时：球体本体交给 three.js，本层只画航线/城市/棋子
        const use3D = ensureGlobe3D();
        cv.classList.toggle('overlay', use3D);
        if (use3D) renderGlobe3D(w, h, cx, cy, R);

        // 星空背景（暗色主题下），增强太空纵深
        if (!use3D) {
        drawStars(ctx, w, h, dark);

        // 大气光晕：球体外侧一圈辉光，强化"这是一个球"的观感
        const glow = ctx.createRadialGradient(cx, cy, R * 0.97, cx, cy, R * 1.22);
        glow.addColorStop(0, dark ? 'rgba(110,190,255,.30)' : 'rgba(110,195,255,.26)');
        glow.addColorStop(1, 'rgba(110,195,255,0)');
        ctx.beginPath(); ctx.arc(cx, cy, R * 1.22, 0, Math.PI * 2);
        ctx.fillStyle = glow; ctx.fill();

        // 海洋球体：径向渐变模拟主光源（左上方向）
        const lx = cx - R * 0.38, ly = cy - R * 0.42;
        const g = ctx.createRadialGradient(lx, ly, R * 0.05, cx, cy, R * 1.05);
        g.addColorStop(0, dark ? '#2a527c' : '#f2fbff');
        g.addColorStop(0.5, dark ? '#16304c' : '#bfe3f4');
        g.addColorStop(1, dark ? '#091524' : '#7cb9d8');
        ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.fillStyle = g; ctx.fill();
        // 边缘入射阴影：制造明暗交界与球体厚度感
        const limb = ctx.createRadialGradient(cx, cy, R * 0.6, cx, cy, R);
        limb.addColorStop(0, 'rgba(0,0,0,0)');
        limb.addColorStop(1, dark ? 'rgba(0,0,0,.5)' : 'rgba(10,40,70,.32)');
        ctx.fillStyle = limb; ctx.fill();
        // 镜面高光
        const spec = ctx.createRadialGradient(lx, ly, 0, lx, ly, R * 0.45);
        spec.addColorStop(0, 'rgba(255,255,255,.28)');
        spec.addColorStop(1, 'rgba(255,255,255,0)');
        ctx.fillStyle = spec; ctx.fill();
        ctx.beginPath(); ctx.arc(cx, cy, R, 0, Math.PI * 2);
        ctx.strokeStyle = dark ? 'rgba(120,170,220,.5)' : 'rgba(80,130,160,.5)';
        ctx.lineWidth = 1.5; ctx.stroke();

        // 经纬网（增强球体感）
        ctx.strokeStyle = dark ? 'rgba(150,195,235,.20)' : 'rgba(255,255,255,.55)';
        ctx.lineWidth = 1;
        for (let lat = -60; lat <= 60; lat += 30) {
          (function (la) {
            drawCurve(ctx, cx, cy, R, function (t) { return { lon: -180 + t * 360, lat: la }; });
          })(lat);
        }
        for (let lon = -180; lon < 180; lon += 30) {
          (function (lo) {
            drawCurve(ctx, cx, cy, R, function (t) { return { lon: lo, lat: -90 + t * 180 }; });
          })(lon);
        }

        // 陆地点阵：按深度淡出并缩小（越靠边缘越淡越小，凸显球面弧度）
        ctx.fillStyle = dark ? '#4c7f57' : '#84c06d';
        const dr0 = Math.max(1, R / 200);
        for (let i = 0; i < GLOBE.dots.length; i++) {
          const p = projectVec(GLOBE.dots[i][0], GLOBE.dots[i][1]);
          if (p.z <= 0.02) continue;
          const d = p.z;                      // 1 = 正对观察者，0 = 地平线
          const s = dr0 * (0.55 + 0.45 * d);
          ctx.globalAlpha = 0.35 + 0.65 * d;
          ctx.fillRect(cx + p.x * R - s, cy + p.y * R - s, s * 2, s * 2);
        }
        ctx.globalAlpha = 1;
        }

        // 航线（大圆弧）：本回合可达的那一段加粗，判定与平面视图完全一致
        const V = cityView();
        (MAP.routes || []).forEach(function (r) {
          const ga = MAP.geo[r[0]], gb = MAP.geo[r[1]];
          if (!ga || !gb) return;
          const pa = projectVec(ga[0], ga[1]), pb = projectVec(gb[0], gb[1]);
          const k = Math.max(pa.z, pb.z);
          if (k <= 0) return;                 // 整条线都在地球背面
          const kk = Math.max(0.15, k);
          const hot = (V.myPos === r[0] && V.reachSet.has(r[1])) ||
                      (V.myPos === r[1] && V.reachSet.has(r[0]));
          ctx.strokeStyle = (MAP.colors[r[2]] || {}).hex || '#888';
          ctx.globalAlpha = (hot ? 0.95 : 0.3) * (0.4 + 0.6 * kk);
          ctx.lineWidth = (hot ? 2.4 : 1.1) * (0.65 + 0.35 * kk);
          strokePath3D(ctx, cx, cy, R, greatCircle(ga, gb, 24));
        });
        ctx.globalAlpha = 1;

        // ---- 城市 / 标签 / 棋子：与平面视图同一套状态、颜色、优先级与避让规则 ----
        ctx.font = '600 11px system-ui, -apple-system, sans-serif';
        ctx.textAlign = 'left';
        const items = [], pawnGroups = [];
        Object.keys(MAP.geo).forEach(function (name) {
          if (!V.shown(name)) return;                    // 只看城市卡时，其余城市整座隐藏
          const p = projectVec(MAP.geo[name][0], MAP.geo[name][1]);
          if (p.z <= 0.03) return;                       // 背面不画
          const d = p.z, x = cx + p.x * R, y = cy + p.y * R;
          const f = V.flags(name);
          items.push({ name: name, x: x, y: y, d: d, f: f, prio: V.prio(name) });
          if (f.pawns.length) pawnGroups.push({ city: name, x: x, y: y, d: d, list: f.pawns });
        });

        // 棋子几何（同城多人并排，与平面一致），先算好当标签避让的障碍物
        const pawnDraws = [], obstacles = [];
        pawnGroups.forEach(function (g) {
          const list = g.list.slice().sort(function (a, b) {   // 自己的棋子最后画（在最上层）
            if (V.my && a.pid === V.my.pid) return 1;
            if (V.my && b.pid === V.my.pid) return -1;
            return 0;
          });
          const n = list.length, spread = n > 1;
          list.forEach(function (p, i) {
            const px = spread ? g.x + (i - (n - 1) / 2) * 14 : g.x;
            const py = spread ? g.y - 15 : g.y;
            const isMine = !!(V.my && p.pid === V.my.pid);
            pawnDraws.push({ px: px, py: py, top: py - 24, p: p, isMine: isMine, d: g.d });
            obstacles.push({ x1: px - 5, y1: py - 38, x2: px + (isMine ? 40 : 24), y2: py - 8 });
          });
          const others = V.my ? list.filter(function (p) { return p.pid !== V.my.pid; }) : list.slice();
          if (others.length) {
            g.others = others.map(function (p) {
              return (p.name || '？') + (p.connected ? '' : '(离线)');
            }).join('、');
            obstacles.push({ x1: g.x - g.others.length * 5, y1: g.y + 10,
                             x2: g.x + g.others.length * 5, y2: g.y + 22 });
          }
        });

        // 标签：LOD（放大后才全部亮名字）+ 与平面共用的避让算法
        const lodAll = (GLOBE.zoom || 1) >= 1.5;
        const labelItems = [];
        items.forEach(function (it) {
          const show = it.d > 0.18 && (lodAll || it.prio < 5);   // 太靠边缘不写名字
          if (!show) { obstacles.push({ x1: it.x - 6, y1: it.y - 6, x2: it.x + 6, y2: it.y + 6 }); return; }
          it.txt = it.name + (it.f.cost ? it.f.cost + '票' : '');
          labelItems.push({ name: it.name, x: it.x, y: it.y, prio: it.prio,
                            w: ctx.measureText(it.txt).width, h: 14 });
        });
        const labelPos = layoutLabels(labelItems, 1, obstacles);
        const halo = dark ? 'rgba(10,18,32,.85)' : 'rgba(255,255,255,.9)';

        // 城市点：可达橙圈 / 公共卡橙红圈 / 秘密目的地绿虚线圈 / 出发城市画大一点
        items.forEach(function (it) {
          const d = it.d, f = it.f;
          ctx.globalAlpha = 0.45 + 0.55 * d;
          if (f.reach) {
            ctx.beginPath(); ctx.arc(it.x, it.y, 10 * (0.7 + 0.3 * d), 0, Math.PI * 2);
            ctx.strokeStyle = 'rgba(255,107,53,.9)'; ctx.lineWidth = 2; ctx.stroke();
          }
          if (f.shared) {
            ctx.beginPath(); ctx.arc(it.x, it.y, 8.5 * (0.7 + 0.3 * d), 0, Math.PI * 2);
            ctx.strokeStyle = '#ff7a59'; ctx.lineWidth = 2; ctx.stroke();
          }
          if (f.secret) {
            ctx.beginPath(); ctx.arc(it.x, it.y, 8.5 * (0.7 + 0.3 * d), 0, Math.PI * 2);
            ctx.strokeStyle = '#2ecc71'; ctx.lineWidth = 2;
            ctx.setLineDash([4, 3]); ctx.stroke(); ctx.setLineDash([]);
          }
          const rad = (f.start ? 5.2 : 3.6) * (0.65 + 0.35 * d);
          ctx.beginPath(); ctx.arc(it.x, it.y, rad, 0, Math.PI * 2);
          ctx.fillStyle = f.reach ? '#ff6b35' : (dark ? '#f2ead9' : '#6b5442');
          ctx.fill();
          ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.4; ctx.stroke();
        });

        // 标签（描边保证可读，与平面的白色光晕等效）
        items.forEach(function (it) {
          const L = labelPos[it.name];
          if (!L) return;
          ctx.globalAlpha = Math.min(1, 0.5 + 0.5 * it.d);
          ctx.textAlign = L.anchor === 'middle' ? 'center' : (L.anchor === 'end' ? 'right' : 'left');
          ctx.lineWidth = 2.5; ctx.strokeStyle = halo;
          ctx.strokeText(it.txt, L.x, L.y);
          ctx.fillStyle = it.f.reach ? '#ff8a4c' : (dark ? '#e8eef7' : '#243447');
          ctx.fillText(it.txt, L.x, L.y);
        });
        ctx.globalAlpha = 1;

        // 棋子：底座 + 旗杆 + 旗帜（与平面同形状、同颜色，加大加白描边更醒目）
        pawnDraws.forEach(function (pd) {
          ctx.globalAlpha = Math.min(1, 0.5 + 0.5 * pd.d);
          const hex = colorHex(pd.p.color);
          const fw = 19, fh = 13;
          // 落点圆标
          ctx.beginPath(); ctx.arc(pd.px, pd.py, 3.6, 0, Math.PI * 2);
          ctx.fillStyle = hex; ctx.fill();
          ctx.strokeStyle = '#fff'; ctx.lineWidth = 1.6; ctx.stroke();
          // 旗杆
          ctx.strokeStyle = hex; ctx.lineWidth = 2.6;
          ctx.beginPath(); ctx.moveTo(pd.px, pd.py); ctx.lineTo(pd.px, pd.top); ctx.stroke();
          // 旗面（带波浪边的三角旗）
          ctx.beginPath();
          ctx.moveTo(pd.px, pd.top);
          ctx.lineTo(pd.px + fw, pd.top + fh * 0.28);
          ctx.quadraticCurveTo(pd.px + fw * 0.55, pd.top + fh * 0.55, pd.px + fw, pd.top + fh * 0.72);
          ctx.lineTo(pd.px, pd.top + fh);
          ctx.closePath();
          ctx.fillStyle = hex; ctx.fill();
          ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.lineJoin = 'round'; ctx.stroke();
          if (pd.isMine) {
            ctx.textAlign = 'left';
            ctx.lineWidth = 2.5; ctx.strokeStyle = halo;
            ctx.strokeText('我', pd.px + fw + 3, pd.top + fh * 0.85);
            ctx.fillStyle = dark ? '#e8eef7' : '#243447';
            ctx.fillText('我', pd.px + fw + 3, pd.top + fh * 0.85);
          }
        });
        // 同城对手名字合并成一行，放在城市点下方（与平面一致）
        pawnGroups.forEach(function (g) {
          if (!g.others) return;
          ctx.globalAlpha = Math.min(1, 0.5 + 0.5 * g.d);
          ctx.textAlign = 'center';
          ctx.font = '600 9px system-ui, -apple-system, sans-serif';
          ctx.lineWidth = 2.5; ctx.strokeStyle = halo;
          ctx.strokeText(g.others, g.x, g.y + 19);
          ctx.fillStyle = dark ? '#93a4b8' : '#5b6b7f';
          ctx.fillText(g.others, g.x, g.y + 19);
          ctx.font = '600 11px system-ui, -apple-system, sans-serif';
        });
        ctx.globalAlpha = 1;
        ctx.textAlign = 'left';
      }

      function globeLoop() {
        if (viewMode !== 'globe') { GLOBE.raf = 0; return; }
        // 不自动旋转：只有拖拽松手后的惯性会继续转一小会儿，随后自然停住
        let moving = false;
        if (!GLOBE.drag && Math.abs(GLOBE.vy) > 1e-4) {
          GLOBE.yaw += GLOBE.vy;
          GLOBE.vy *= 0.92;                 // 惯性衰减
          moving = true;
        }
        // 静止时不做无谓重绘，省 CPU
        if (moving || GLOBE.dirty) { renderGlobe(); GLOBE.dirty = false; }
        GLOBE.raf = requestAnimationFrame(globeLoop);
      }
      function startGlobeLoop() {
        if (!GLOBE.raf) GLOBE.raf = requestAnimationFrame(globeLoop);
      }
      function globeHitTest(clientX, clientY) {
        const cv = $('globe');
        if (!cv || !MAP) return null;
        const rect = cv.getBoundingClientRect();
        const x = clientX - rect.left, y = clientY - rect.top;
        let best = null, bd = 1e9;
        Object.keys(MAP.geo).forEach(function (name) {
          const gg = MAP.geo[name];
          const p = projectVec(gg[0], gg[1]);
          if (p.z <= 0) return;
          const px = GLOBE.cx + p.x * GLOBE.r, py = GLOBE.cy + p.y * GLOBE.r;
          const d = Math.sqrt((px - x) * (px - x) + (py - y) * (py - y));
          if (d < bd) { bd = d; best = name; }
        });
        return bd <= 16 ? best : null;
      }
      function initGlobeInteractions() {
        const cv = $('globe');
        if (!cv) return;
        cv.addEventListener('pointerdown', function (e) {
          GLOBE.drag = true; GLOBE.moved = 0;
          GLOBE.lx = e.clientX; GLOBE.ly = e.clientY;
          cv.classList.add('dragging');
          try { cv.setPointerCapture(e.pointerId); } catch (err) {}
        });
        cv.addEventListener('pointermove', function (e) {
          if (!GLOBE.drag) return;
          const dx = e.clientX - GLOBE.lx, dy = e.clientY - GLOBE.ly;
          GLOBE.lx = e.clientX; GLOBE.ly = e.clientY;
          GLOBE.moved += Math.abs(dx) + Math.abs(dy);
          GLOBE.yaw += dx * 0.006;
          GLOBE.pitch = Math.max(-1.2, Math.min(1.2, GLOBE.pitch + dy * 0.006));
          GLOBE.vy = dx * 0.006;            // 记录速度，松手后作为惯性
          GLOBE.dirty = true;
        });
        const endDrag = function () {
          GLOBE.drag = false; cv.classList.remove('dragging');
        };
        cv.addEventListener('pointerup', endDrag);
        cv.addEventListener('pointercancel', endDrag);
        // 滚轮缩放（0.75x ~ 2.2x）
        cv.addEventListener('wheel', function (e) {
          e.preventDefault();
          setGlobeZoom((GLOBE.zoom || 1) * (e.deltaY < 0 ? 1.12 : 0.89));
        }, { passive: false });
        // 双击复位缩放
        cv.addEventListener('dblclick', function () { setGlobeZoom(1); });
        cv.addEventListener('click', function (e) {
          if (GLOBE.moved > 6) return;          // 拖动过就不当作点击
          const city = globeHitTest(e.clientX, e.clientY);
          if (!city || !state) return;
          const info = (state.moves || []).find(function (m) { return m.to === city; });
          const canGo = !!(state.current_pid === myPid && state.phase === 'move' && info);
          if (canGo && !CITY_INFO[city]) {
            socket.emit('move', { room_id: state.room_id, player_id: myPid,
                                  neighbor: city, color: info.color });
            return;
          }
          openCityCard(city);
        });
      }
      function applyView() {
        const isGlobe = viewMode === 'globe';
        const cv = $('globe'), bd = $('board'), vb = $('viewBtn');
        if (cv) cv.classList.toggle('hidden', !isGlobe);
        if (bd) bd.classList.toggle('hidden', isGlobe);
        if (vb) vb.textContent = isGlobe ? '🌍 球面' : '🗺 平面';
        const g3 = $('globe3d'), gs = $('globeStyleSel');
        if (g3) g3.classList.toggle('hidden', !isGlobe);
        // 风格选择器只在球面视图、且 WebGL 真的可用时出现
        if (gs) {
          gs.classList.toggle('hidden', !isGlobe || !ensureGlobe3D());
          gs.value = globeStyle;
        }
        const zc = $('mapZoom');   // 缩放控件：平面 / 球面都要有（两个视图功能保持一致）
        if (zc) zc.classList.remove('hidden');
        updateZoomTag();
        try { localStorage.setItem(VIEW_KEY, viewMode); } catch (e) {}
        if (isGlobe) { syncGlobeStart(); buildGlobeDots(); GLOBE.dirty = true; startGlobeLoop(); }
        else if (state) { render(); }
      }

      // ---------- 城市知识卡：地理 / 历史 / 风土 + 知识问答 ----------
      function yearText(y) {
        if (typeof y !== 'number') return '';
        return y < 0 ? '公元前 ' + Math.abs(y) + ' 年' : y + ' 年';
      }
      // 城市卡上显示"国家/城市名"（如 法国/巴黎）；没有国家数据或同名时只显示城市
      function cityLabel(name) {
        if (!name) return '';
        const info = CITY_INFO[name];
        const country = info && info.country;
        return (country && country !== name) ? country + '/' + name : name;
      }

      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
        });
      }
      function cityPoints(name) {
        const c = (MAP.cities || []).find(function (x) { return x.name === name; });
        return c ? c.points : 0;
      }
      function openCityCard(name) {
        if (!CITY_INFO[name]) { toast('这座城市还没有知识卡'); return; }
        const info = CITY_INFO[name];
        const m = me();
        const reach = ((state && state.moves) || []).find(function (x) { return x.to === name; });
        const canGo = !!(m && state.current_pid === myPid && state.phase === 'move' && reach);
        const q = (m && m.quiz && m.quiz.city === name) ? m.quiz : null;
        let html = '<h2>' + (info.flag || '📍') + ' ' + esc(name) + '</h2>';
        html += '<div class="csub">' + esc(info.country || '') + ' · ' + esc(info.zone || '') +
          (typeof info.year === 'number' ? ' · 关键年份 ' + yearText(info.year) : '') +
          ' · 城市卡 ' + cityPoints(name) + ' 分</div>';
        if (info.geo) html += '<div class="csec"><div class="lab">📍 地理</div><p>' + esc(info.geo) + '</p></div>';
        if (info.hist) html += '<div class="csec"><div class="lab">🏛 历史（' + yearText(info.year) +
          '）</div><p>' + esc(info.hist) + '</p></div>';
        html += '<div class="csec"><div class="lab">🍜 风土人情</div><div class="cfacts">' +
          (info.sight ? '<div>🏛 地标：' + esc(info.sight) + '</div>' : '') +
          (info.food ? '<div>🍽 美食：' + esc(info.food) + '</div>' : '') +
          (info.hello ? '<div>💬 问候语：' + esc(info.hello) + '</div>' : '') +
          '</div></div>';
        if (q) {
          html += '<div class="quiz"><div class="qtitle">❓ ' + esc(info.cat || '知识') +
            '小问题：' + esc(q.q) + '</div>';
          (q.o || []).forEach(function (op, i) {
            html += '<button class="opt" data-idx="' + i + '">' + esc(op) + '</button>';
          });

        }
        html += '<div class="cbtns">' +
          (canGo ? '<button class="btn primary" id="goBtn">✈ 前往（' + reach.cost + ' 张' +
            colorName(reach.color) + '票）</button>' : '') +
          '<button class="btn ghost" id="closeCardBtn">' + (canGo ? '再看看' : '关闭') + '</button></div>';
        const card = $('cityCard');
        card.innerHTML = html;
        card.dataset.answered = '';
        card.dataset.pick = '';
        $('cityModal').classList.remove('hidden');
        $('closeCardBtn').onclick = function () { $('cityModal').classList.add('hidden'); };
        const gb = $('goBtn');
        if (gb) gb.onclick = function () {
          socket.emit('move', { room_id: myRoom, player_id: myPid, neighbor: name, color: reach.color });
          $('cityModal').classList.add('hidden');
        };
        card.querySelectorAll('.opt').forEach(function (b) {
          b.onclick = function () {
            if (card.dataset.answered === '1') return;
            card.dataset.answered = '1';
            card.dataset.pick = b.getAttribute('data-idx');
            socket.emit('answer_quiz', {
              room_id: myRoom, player_id: myPid,

      // ---------- 护照：印章 / 大洲奖章 / 历史时间轴 ----------
      function renderPassport() {
        const panel = $('passportPanel');
        const m = me();
        // 只有带知识库的棋盘（如《世界之旅》）才显示护照
        if (!m || !Object.keys(CITY_INFO).length) { panel.classList.add('hidden'); return; }
        panel.classList.remove('hidden');
        const stamps = m.passport || {};
        const keys = Object.keys(stamps);
        const byZone = {};
        keys.forEach(function (c) {
          const z = (stamps[c] || {}).zone || '其他';
          (byZone[z] = byZone[z] || []).push(c);
        });

        let html = '';
        Object.keys(byZone).forEach(function (z) {
          const list = byZone[z];
          const has = (m.medals || []).indexOf(z) >= 0;
