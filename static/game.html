            (has ? ' 🏅已获' : '（集齐 ' + need + ' 座得奖章）') + '</div>';
          html += '<div class="stampgrid">' + list.map(function (c) {
            return '<span class="stamp" data-city="' + esc(c) + '">' +
              ((stamps[c] || {}).flag || '') + ' ' + esc(c) + '</span>';
          }).join('') + '</div>';
        });
        if (!keys.length) html = '<p class="tip">还没有印章——出发去世界各地盖章吧！</p>';
        $('passportBox').innerHTML = html;
        $('passportBox').querySelectorAll('.stamp').forEach(function (el) {
          el.onclick = function () { openCityCard(el.getAttribute('data-city')); };
        });
        $('medalBox').innerHTML = (m.medals || []).length
          ? '<div>' + m.medals.map(function (z) {
              return '<span class="medal">🏅 ' + esc(z) + '奖章 +' + (state.medal_score || 2) + '分</span>';
            }).join('') + '</div>'
          : '';
        const tl = keys.slice().sort(function (a, b) {
          const ya = (stamps[a] || {}).year, yb = (stamps[b] || {}).year;
          return (typeof ya === 'number' ? ya : 0) - (typeof yb === 'number' ? yb : 0);
        });
        $('timelineBox').innerHTML = tl.length
          ? tl.map(function (c) {
              return '<div class="row"><span class="yr">' + yearText((stamps[c] || {}).year) +
                '</span><span>' + ((stamps[c] || {}).flag || '') + ' ' + esc(c) + '</span></div>';
            }).join('')
          : '<p class="tip">去过的城市会按历史年份排成一条时间轴。</p>';
        const okN = m.quiz_ok || 0, noN = m.quiz_no || 0;
        $('quizStat').innerHTML = (okN + noN)
          ? '答对 ' + okN + ' 题 / 共答 ' + (okN + noN) + ' 题（答错也给讲解，不扣分）'
          : '';
      }

      // ---------- 平面地图：缩放 / 平移 / 回到我的位置 ----------
      function zoomLevel() { return VW / view.w; }

      function clampView(v) {
        // 最小 = 整张地图；最大 = 放大 8 倍；且不允许把视野推到地图之外
        v.w = Math.max(VW / 8, Math.min(VW, v.w));
        v.h = v.w * VH / VW;
        v.x = Math.max(0, Math.min(VW - v.w, v.x));
        v.y = Math.max(0, Math.min(VH - v.h, v.y));
      }

      function zoomAt(z, cx, cy) {
        /** 缩放到 z 倍；(cx, cy) 为焦点（SVG 坐标），不传则保持视野中心不动。 */
        z = Math.max(1, Math.min(8, z));
        const nw = VW / z, nh = VH / z;
        const px = (cx == null ? view.x + view.w / 2 : cx);
        const py = (cy == null ? view.y + view.h / 2 : cy);
        const rx = (px - view.x) / view.w, ry = (py - view.y) / view.h;
        view.w = nw; view.h = nh;
        view.x = px - rx * nw; view.y = py - ry * nh;
        clampView(view);
        updateZoomTag();
      }

      // 缩放倍数标签：哪个视图就显示哪个视图的倍数（平面 view.w / 球面 GLOBE.zoom）
      function updateZoomTag() {
        const t = $('zoomTag');
        if (!t) return;
        const z = (viewMode === 'globe') ? (GLOBE.zoom || 1) : zoomLevel();
        t.textContent = z.toFixed(1) + '×';
      }

      // 球面：与平面同一套按钮语义（放大 / 缩小 / 回到我），内部走 GLOBE.zoom
      function setGlobeZoom(z) {
        GLOBE.zoom = Math.max(0.75, Math.min(2.2, z));   // 与滚轮缩放同一区间
        GLOBE.dirty = true;
        updateZoomTag();
        renderGlobe();
      }
      function focusGlobeMyCity() {
        const m = me();
        const city = (m && m.position) || currentStartCity() || (MAP && MAP.start);
        const g = MAP && MAP.geo && MAP.geo[city];
        if (!g) { toast('暂时无法定位'); return; }
        GLOBE.yaw = g[0] * Math.PI / 180;
        GLOBE.pitch = g[1] * Math.PI / 180;
        GLOBE.init = true;
        GLOBE.vy = 0;                 // 清掉惯性，避免刚对准就被甩走
        GLOBE.dirty = true;
        updateZoomTag();
        renderGlobe();
        toast('回到 ' + city);
      }

      function focusMyCity() {
        /** "*" 键：把镜头对准我（或出发点）所在的城市。 */
        const m = me();
        const city = (m && m.position) || (MAP && MAP.start);
        const p = POS[city];
        const z = Math.max(2, zoomLevel());   // 至少放大到 2 倍，才看得出"回到这里"
        zoomAt(z);
        if (p) { view.x = p.x - view.w / 2; view.y = p.y - view.h / 2; clampView(view); }
        updateZoomTag();
        if (state) renderBoard();
        if (city) toast('回到 ' + city);
      }

      function initBoardZoom() {
        const bd = $('board');
        let dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0;
        // 拖动平移（与"点城市移动"共存：位移小于 6px 才算点击）
        bd.addEventListener('pointerdown', function (e) {
          if (viewMode !== 'flat') return;
          dragging = true; moved = false; panned = false;
          sx = e.clientX; sy = e.clientY; ox = view.x; oy = view.y;
          try { bd.setPointerCapture(e.pointerId); } catch (err) {}
        });
        bd.addEventListener('pointermove', function (e) {
          if (!dragging) return;
          const dx = e.clientX - sx, dy = e.clientY - sy;
          if (!moved && Math.abs(dx) + Math.abs(dy) < 6) return;
          moved = true; panned = true;
          const k = view.w / (bd.clientWidth || 1);
          view.x = ox - dx * k; view.y = oy - dy * k;
          clampView(view);
          renderBoard();
        });
        const stop = function () { dragging = false; };
        bd.addEventListener('pointerup', stop);
        bd.addEventListener('pointercancel', stop);
        // 滚轮缩放：以鼠标位置为焦点
        bd.addEventListener('wheel', function (e) {
          if (viewMode !== 'flat') return;
          e.preventDefault();
          const rect = bd.getBoundingClientRect();
          const k = view.w / (rect.width || 1);
          const cx = view.x + (e.clientX - rect.left) * k;
          const cy = view.y + (e.clientY - rect.top) * k;
          zoomAt(zoomLevel() * (e.deltaY < 0 ? 1.25 : 0.8), cx, cy);
          renderBoard();
        }, { passive: false });

        // 三个缩放按钮：按当前视图分发，平面 / 球面表现一致
        $('zoomInBtn').addEventListener('click', function () {
          if (viewMode === 'globe') { setGlobeZoom((GLOBE.zoom || 1) * 1.25); return; }
          zoomAt(zoomLevel() * 1.5); renderBoard();
        });
        $('zoomOutBtn').addEventListener('click', function () {
          if (viewMode === 'globe') { setGlobeZoom((GLOBE.zoom || 1) / 1.25); return; }
          zoomAt(zoomLevel() / 1.5); renderBoard();
        });
        $('zoomMeBtn').addEventListener('click', function () {
          if (viewMode === 'globe') { focusGlobeMyCity(); return; }
          focusMyCity();
        });
      }

      // ================= 平面 / 球面共用的城市呈现规则 =================
      // 两个视图必须显示同一套城市状态（可达 / 公共卡 / 秘密目的地 / 出发城市 / 棋子）
      // 和同一套标签排布结果，避免"平面看到、球面看不到"的不一致。

      // 标签候选位：相对城市点的偏移（单位=屏幕像素，平面视图再乘以 1/zoom）
      const CITY_LABEL_CAND = [
        { dx: 0, dy: -12, anchor: 'middle' }, { dx: 0, dy: 20, anchor: 'middle' },
        { dx: 14, dy: 4, anchor: 'start' }, { dx: -14, dy: 4, anchor: 'end' },
        { dx: 0, dy: -26, anchor: 'middle' }, { dx: 0, dy: 34, anchor: 'middle' },
        { dx: 16, dy: -12, anchor: 'start' }, { dx: -16, dy: -12, anchor: 'end' },
      ];
      // 个别城市手工指定位置（特殊地形处压线，两个视图共用）
      const CITY_LABEL_OVERRIDES = {
        '敦煌': { dx: -13, dy: 4, anchor: 'end' },
        '洛阳': { dx: -13, dy: 4, anchor: 'end' },
        '苏州': { dx: 0, dy: 20, anchor: 'middle' },
        '遵义': { dx: 14, dy: 4, anchor: 'start' },
        '大理': { dx: -13, dy: 4, anchor: 'end' },
        '呼伦贝尔': { dx: -13, dy: 4, anchor: 'end' },
      };

      // 当前房间的出发城市（支持房主指定 / 随机，开局后 state 里是实际城市）
      function currentStartCity() {
        if (state && state.start_city && state.start_city !== 'random' && POS[state.start_city]) {
          return state.start_city;
        }
        return (MAP && MAP.start) || null;
      }

      // 本帧的城市状态快照：平面与球面都从这里取，保证一致
      function cityView() {
        const my = me();
        const myPos = my ? my.position : null;
        const byCity = {};
        ((state && state.players) || []).forEach(function (p) {
          (byCity[p.position] = byCity[p.position] || []).push(p);
        });
        const reachSet = new Set(), reachInfo = {};
        if (my && state.phase === 'move' && state.moves) {
          state.moves.forEach(function (m) {          // 官方规则：可沿同色线路连续走多段
            reachSet.add(m.to);
            const prev = reachInfo[m.to];
            if (!prev || m.cost < prev.cost) reachInfo[m.to] = m;
          });
        }
        const shared = ((state && state.shared_cards) || []).map(function (c) { return c.city; }).filter(Boolean);
        const start = currentStartCity();
        const secret = my ? my.secret : null;
        // "只看城市卡"时要保留的城市：桌面公共卡 + 我的秘密目的地 + 棋子所在城市
        const cards = new Set();
        shared.forEach(function (c) { cards.add(c); });
        if (secret) cards.add(secret);
        Object.keys(byCity).forEach(function (c) { if (c) cards.add(c); });
        // 开启"只看城市卡"时，这两个视图用同一个判据过滤城市
        const shown = function (n) { return !cardOnly || cards.has(n); };
        return {
          my: my, myPos: myPos, byCity: byCity, reachSet: reachSet, reachInfo: reachInfo,
          shared: shared, start: start, secret: secret, cards: cards, shown: shown,
          // 0=我所在 1=本回合可达 2=有棋子 3=公共卡/秘密目的地 4=出发城市 5=其他
          prio: function (n) {
            if (n === myPos) return 0;
            if (reachSet.has(n)) return 1;
            if (byCity[n] && byCity[n].length) return 2;
            if (shared.indexOf(n) >= 0 || n === secret) return 3;
            if (n === start) return 4;
            return 5;
          },
          flags: function (n) {
            return {
              mine: n === myPos,
              reach: reachSet.has(n),
              cost: reachInfo[n] ? reachInfo[n].cost : null,
              shared: shared.indexOf(n) >= 0,
              secret: n === secret,
              start: n === start,
              pawns: byCity[n] || []
            };
          }
        };
      }

      // 标签避让：按优先级抢占候选位，避开已放的标签与障碍物（圆点、棋子旗）
      // items: [{name, x, y, w, h, prio}]，坐标/尺寸均为调用方坐标系；scale 用于缩放候选位偏移
      function layoutLabels(items, scale, obstacles) {
        const s = scale || 1, out = {}, placed = [];
        const hitRect = function (a, b) {
          return !(a.x2 < b.x1 || a.x1 > b.x2 || a.y2 < b.y1 || a.y1 > b.y2);
        };
        const base = CITY_LABEL_CAND.map(function (c) {
          return { dx: c.dx * s, dy: c.dy * s, anchor: c.anchor };
        });
        items.slice().sort(function (a, b) { return a.prio - b.prio || a.y - b.y; })
          .forEach(function (it) {
            const ov = CITY_LABEL_OVERRIDES[it.name];
            const list = ov ? [{ dx: ov.dx * s, dy: ov.dy * s, anchor: ov.anchor }].concat(base) : base;
            let best = null, bestScore = Infinity;
            for (let i = 0; i < list.length; i++) {
              const o = list[i];
              const lx = it.x + o.dx, ly = it.y + o.dy;
              const x1 = o.anchor === 'middle' ? lx - it.w / 2 : (o.anchor === 'end' ? lx - it.w : lx);
              const rect = { x1: x1 - 2 * s, y1: ly - it.h, x2: x1 + it.w + 2 * s, y2: ly + 3 * s };
              let score = i;                       // 越靠前的候选位越好
              placed.forEach(function (q) { if (hitRect(rect, q)) score += 100; });
              (obstacles || []).forEach(function (q) { if (hitRect(rect, q)) score += 30; });
              if (score < bestScore) {
                bestScore = score;
                best = { x: lx, y: ly, anchor: o.anchor, rect: rect };
              }
              if (score === i) break;              // 已是无冲突位置，提前收工
            }
            if (!best) {
              best = { x: it.x, y: it.y - 12 * s, anchor: 'middle',
                       rect: { x1: it.x - it.w / 2, y1: it.y - it.h - 12 * s,
                               x2: it.x + it.w / 2, y2: it.y + 3 * s - 12 * s } };
            }
            placed.push(best.rect);
            out[it.name] = best;
          });
        return out;
      }

      function renderBoard() {
        const board = $('board');
        const W = 1000, H = 720;
        const V = cityView();                      // 与球面视图同一份城市状态
        const my = V.my;
        const myPos = V.myPos;
        const reachSet = V.reachSet, reachInfo = V.reachInfo;

        let routesSvg = '';
        MAP.routes.forEach(function (r) {
          const a = r[0], b = r[1], color = r[2];
          const ca = POS[a], cb = POS[b];
          const isReach = (myPos === a && reachSet.has(b)) || (myPos === b && reachSet.has(a));
          const cls = 'route' + (isReach ? ' reach' : '');
          routesSvg += '<line class="' + cls + '" x1="' + ca.x + '" y1="' + ca.y +
            '" x2="' + cb.x + '" y2="' + cb.y + '" stroke="' + colorHex(color) + '" />';
        });

        const sharedCities = V.shared;
        const mySecret = V.secret;
        const startCity = V.start;
        const byCity = V.byCity;                        // 棋子先摆好（标签避让时要避开旗帜）

        // ---- 屏幕恒定尺寸：放大 N 倍时，圆点/文字/棋子在屏幕上保持原大小 ----
        const s = 1 / zoomLevel();

        // ---- 只排视野内的城市，重要城市优先 ----
        const pad = 60 * s + 30;
        const visible = Object.keys(POS).filter(function (n) {
          if (!V.shown(n)) return false;               // 只看城市卡时，其余城市整座隐藏
          const p = POS[n];
          return p.x > view.x - pad && p.x < view.x + view.w + pad &&
                 p.y > view.y - pad && p.y < view.y + view.h + pad;
        });
        // 分级显示（LOD）：低倍率只标重要城市，放大后才全部亮出名字
        const lodAll = zoomLevel() >= 1.6;
        const showLabel = {};
        visible.forEach(function (n) { if (lodAll || V.prio(n) < 5) showLabel[n] = true; });

        // 障碍物：不显示标签的城市圆点 + 所有棋子旗帜
        const obstacles = [];
        visible.forEach(function (n) {
          if (showLabel[n]) return;
          const p = POS[n];
          obstacles.push({ x1: p.x - 10 * s, y1: p.y - 10 * s, x2: p.x + 10 * s, y2: p.y + 10 * s });
        });

        // ---- 棋子几何与绘制（尺寸随 s 缩放）----
        const pawnBoxes = [];
        let pawnsSvg = '';
        Object.keys(byCity).forEach(function (city) {
          // 自己的棋子画在最上层
          const list = byCity[city].slice().sort(function (a, b) {
            if (my && a.pid === my.pid) return 1;
            if (my && b.pid === my.pid) return -1;
            return 0;
          });
          const base = POS[city];
          if (!base) return;
          const n = list.length;
          const spread = n > 1;
          list.forEach(function (p, i) {
            const px = spread ? base.x + (i - (n - 1) / 2) * 14 * s : base.x;
            const py = spread ? base.y - 15 * s : base.y;
            const isMine = my && p.pid === my.pid;
            const hex = colorHex(p.color);
            // 旗杆 + 旗帜（所有玩家统一）：底座圆点 + 加粗旗杆 + 白描边大旗面，远处也一眼可见
            const top = py - 24 * s;
            const fw = 19 * s, fh = 13 * s;
            pawnsSvg += '<circle cx="' + px + '" cy="' + py + '" r="' + (3.6 * s).toFixed(2) +
              '" fill="' + hex + '" stroke="#fff" stroke-width="' + (1.6 * s).toFixed(2) + '"/>';
            pawnsSvg += '<line class="pawn-pole" x1="' + px + '" y1="' + py + '" x2="' + px + '" y2="' + top +
              '" stroke="' + hex + '" stroke-width="' + (2.6 * s).toFixed(2) + '"/>';
            pawnsSvg += '<path class="pawn-flag" d="M' + px + ' ' + top +
              ' L' + (px + fw) + ' ' + (top + fh * 0.28).toFixed(2) +
              ' Q' + (px + fw * 0.55).toFixed(2) + ' ' + (top + fh * 0.55).toFixed(2) +
              ' ' + (px + fw) + ' ' + (top + fh * 0.72).toFixed(2) +
              ' L' + px + ' ' + (top + fh) + ' Z" fill="' + hex +
              '" stroke="#fff" stroke-width="' + (2 * s).toFixed(2) + '" stroke-linejoin="round"/>';
            if (isMine) {
              pawnsSvg += '<text class="pawn-tag" style="font-size:' + (12 * s).toFixed(1) + 'px" x="' +
                (px + fw + 3 * s) + '" y="' + (top + fh * 0.85).toFixed(2) + '" text-anchor="start">我</text>';
            }
            pawnBoxes.push({ x1: px - 5 * s, y1: top - 4 * s, x2: px + (fw + (isMine ? 18 : 4) * s), y2: py + 5 * s });
          });
          // 同城所有对手的名字合并成一行，放在城市点下方
          const others = my ? list.filter(function (p) { return p.pid !== my.pid; }) : [];
          if (others.length) {
            const names = others.map(function (p) {
              return (p.name || '？') + (p.connected ? '' : '(离线)');
            }).join('、');
            pawnsSvg += '<text class="pawn-other-tag" style="font-size:' + (9 * s).toFixed(1) + 'px" x="' + base.x +
              '" y="' + (base.y + 19 * s) + '" text-anchor="middle">' + esc(names) + '</text>';
            pawnBoxes.push({ x1: base.x - names.length * 5 * s, y1: base.y + 10 * s, x2: base.x + names.length * 5 * s, y2: base.y + 22 * s });
          }
        });
        pawnBoxes.forEach(function (b) { obstacles.push(b); });

        // ---- 标签位置：与球面视图共用 layoutLabels（同样的优先级、候选位与避让规则）----
        const labelItems = visible.filter(function (n) { return showLabel[n]; }).map(function (n) {
          return {
            name: n, x: POS[n].x, y: POS[n].y, prio: V.prio(n),
            w: n.length * 12 * s + (reachInfo[n] ? 26 * s : 0), h: 14 * s
          };
        });
        const labelPos = layoutLabels(labelItems, s, obstacles);

        let citiesSvg = '';
        visible.forEach(function (name) {
          const c = POS[name];
          let cls = 'city';
          if (reachSet.has(name)) cls += ' reach';
          if (sharedCities.indexOf(name) >= 0) cls += ' shared';
          if (name === mySecret) cls += ' secret';
          if (name === startCity) cls += ' start';
          // 出发城市画大一点（当前房间的出发城市，可能是房主指定 / 随机结果）
          const r = (name === startCity ? 9 : 7) * s;
          const info = CITY_INFO[name];
          const tip = (info && info.flag ? info.flag + ' ' : '') + name;
          citiesSvg += '<g class="' + cls + '" data-city="' + name + '">' +
            '<title>' + esc(tip) + '</title>' +
            '<circle class="city-circle" cx="' + c.x + '" cy="' + c.y + '" r="' + r.toFixed(2) + '" fill="#fff"/>';
          if (showLabel[name]) {
            const L = labelPos[name];
            citiesSvg += '<text class="city-label" style="font-size:' + (11.5 * s).toFixed(1) + 'px" x="' + L.x +
              '" y="' + L.y + '" text-anchor="' + L.anchor + '">' + esc(name) +
              (reachInfo[name] ? '<tspan class="cost" style="font-size:' + (9 * s).toFixed(1) + 'px">' +
                reachInfo[name].cost + '票</tspan>' : '') + '</text>';
          }
          citiesSvg += '</g>';
        });

        // 本回合已走过的路线（橙色虚线）
        let pathSvg = '';
        const mp = (state.move_path || []);
        if (mp.length > 1) {
          const pts = mp.map(function (c) { return POS[c].x + ',' + POS[c].y; }).join(' ');
          pathSvg = '<polyline class="move-path" points="' + pts + '" />';
        }

        const landSvg = LAND_PATHS.map(function (d) {
          return '<path class="land" d="' + d + '" />';
        }).join('');
        board.innerHTML = '<svg viewBox="' + view.x + ' ' + view.y + ' ' + view.w + ' ' + view.h +
          '" preserveAspectRatio="xMidYMid meet" style="--zs:' + zoomLevel().toFixed(3) + '">' +
          landSvg + routesSvg + pathSvg + citiesSvg + pawnsSvg + '</svg>';

        board.querySelectorAll('.city').forEach(function (g) {
          g.addEventListener('click', function () {
            if (panned) return;                        // 刚刚是在拖动地图，不算点城市
            const target = g.getAttribute('data-city');
            const info = reachInfo[target];
            const canGo = !!(my && state.current_pid === myPid && state.phase === 'move' && info);
            // 有知识库的棋盘（世界之旅）：点城市先看知识卡，卡里有"前往"按钮
            // 没有知识库的棋盘（山河之旅）：保持正版"点一下就走"的手感
            if (canGo && !CITY_INFO[target]) {
              socket.emit('move', {
                room_id: myRoom, player_id: myPid,
                neighbor: target, color: info.color
              });
              return;
            }
            openCityCard(target);
          });
        });
      }

      function renderSidebar() {
        const m = me();
        const pl = $('playerList');
        pl.innerHTML = state.players.map(function (p) {
          const dot = '<span class="dot" style="background:' + colorHex(p.color) + '"></span>';
          const cur = p.is_current ? ' current' : '';
          const off = p.connected ? '' : '<span class="offline">离线</span>';
          const cardsTxt = (p.cards && p.cards.length) ? p.cards.join('、') : '暂无';
          const cardsLine = '<span class="pcards">🃏 已收城市卡：' + cardsTxt + '</span>';
          const medalTxt = (p.medals && p.medals.length) ? ' 🏅' + p.medals.length : '';
          if (p.bot) {
            return '<div class="player bot' + cur + '">' + dot +
              '<span class="pname">' + p.name + '</span>' +
              '<span class="goal">机器人</span>' +
              '<span class="pscore">' + p.score + '分' + medalTxt + '</span>' +
              cardsLine + '</div>';
          }
          const goal = p.goal_done ? ' ✅目的地已完成' : '';
          // 第 4 张牌是秘密目的地：自己的可见，别人的看不到
          const card4 = m && p.pid === m.pid
            ? '<span class="pcard">🎴 ' + esc(cityLabel(p.secret)) + '</span>'
            : '<span class="pcard">🎴 ？？？</span>';
          return '<div class="player' + cur + '">' + dot +
            '<span class="pname">' + p.name + off + '</span>' +
            '<span class="goal">目标' + goal + '</span>' +
            card4 +
            '<span class="pscore">' + p.score + '分' + medalTxt + '</span>' +
            cardsLine + '</div>';
        }).join('');

        // 每人 4 张牌：前 3 张公共（所有人可见），第 4 张为秘密目的地（仅本人可见）
        const sc = $('sharedCards');
        const pub = state.shared_cards || [];
        const no = ['①', '②', '③', '④', '⑤', '⑥', '⑦', '⑧'];
        const ct = $('cardsTitle');
        if (ct) ct.textContent = '城市卡（桌面 ' + pub.length + ' 张 + 秘密目的地）';
        let cardsHtml = '';
        for (let i = 0; i < pub.length; i++) {
          const c = pub[i];
          cardsHtml += c && c.city
            ? '<div class="cardchip"><div class="cno">' + no[i] + '</div>' +
              '<div class="ccity">' + esc(cityLabel(c.city)) + '</div><div class="cpts">' + c.points + '分</div></div>'
            : '<div class="cardchip empty"><div class="cno">' + no[i] + '</div><div class="ccity">空</div></div>';
        }
        cardsHtml += (m && m.secret)
          ? '<div class="cardchip secret"><div class="cno">' + no[pub.length] + '</div>' +
            '<div class="ccity">' + esc(cityLabel(m.secret)) + '</div><div class="cpts">仅你可见</div></div>'
          : '<div class="cardchip secret"><div class="cno">' + no[pub.length] + '</div>' +
            '<div class="ccity">🎴 秘密目的地</div></div>';
        sc.innerHTML = cardsHtml;

        const tb = $('ticketBox');
        if (!m) { tb.innerHTML = ''; }
        else {
          let html = '';
          Object.keys(MAP.colors).forEach(function (c) {
            const n = m.tickets[c] || 0;
            html += '<div class="ticket"><span class="swatch" style="background:' + colorHex(c) + '"></span>' + colorName(c) + ' ' + n + '</div>';
          });
          const w = m.tickets.go || 0;
          html += '<div class="ticket wild"><span class="swatch" style="background:' + colorHex('go') + '"></span>GO ' + w + '</div>';
          tb.innerHTML = html;
        }

        const lb = $('logBox');
        lb.innerHTML = (state.log || []).map(function (l) { return '<div>' + esc(l) + '</div>'; }).join('');
        lb.scrollTop = lb.scrollHeight;
        renderPassport();
        renderChat();
      }

      // 房间聊天：来自服务端的 messages（所有人可见，自己发的那行右侧高亮）
      function renderChat() {
        const cb = $('chatBox');
        if (!cb) return;
        const list = state.messages || [];
        // 用户正在往上翻历史时不要强行拉到底部；新消息来了才自动跟随
        const nearBottom = cb.scrollHeight - cb.scrollTop - cb.clientHeight < 40;
        cb.innerHTML = list.length
          ? list.map(function (c) {
              const mine = myPid && c.pid === myPid;
              return '<div class="msg' + (mine ? ' mine' : '') + '">' +
                '<span class="dot" style="background:' + colorHex(c.color) + '"></span>' +
                '<span class="who">' + esc(c.name || '玩家') + '：</span>' +
                '<span class="txt">' + esc(c.text) + '</span></div>';
            }).join('')
          : '<div class="chat-empty">还没有人说话，打个招呼吧 👋</div>';
        if (nearBottom || cb.dataset.followed !== '1') {
          cb.scrollTop = cb.scrollHeight;
          cb.dataset.followed = '1';
        }
      }

      function sendChat() {
        const inp = $('chatInput');
        const text = (inp.value || '').trim();
        if (!text) return;
        if (!joined || !myRoom || !myPid) { toast('先加入房间才能聊天'); return; }
        inp.value = '';
        // 等 ack：确认送达（服务端已广播）才放心；没确认就把原文还给输入框，
        // 避免「发了却无声无息」（常见于服务器进程是加聊天功能前启动的旧进程）
        let acked = false;
        const timer = setTimeout(function () {
          if (acked) return;
          acked = true;
          inp.value = text; inp.focus();
          toast('消息未送达：请刷新页面；若刷新无效请重启服务器（python server.py）');
        }, 2500);
        socket.emit('chat', { room_id: myRoom, player_id: myPid, text: text }, function (ok) {
          if (acked) return;
          acked = true; clearTimeout(timer);
          if (!ok) { inp.value = text; inp.focus(); toast('发送失败，请重试'); }
        });
      }

      function renderControls() {
        const m = me();
        const isMyTurn = m && state.current_pid === myPid && state.state === 'playing';
        const isHost = state.host_pid === myPid;

        $('roomTag').textContent = '房间号 ' + state.room_id;
        $('roomTag').classList.remove('hidden');

        const turnP = state.players.find(function (p) { return p.pid === state.current_pid; });
        const ti = $('turnInfo');
        if (state.state === 'lobby') {
          ti.textContent = '等待开始（' + state.players.length + '/4 人）';
        } else if (state.state === 'finished') {
          const w = state.players.find(function (p) { return p.pid === state.winner; });
          ti.textContent = w ? ('🎉 ' + w.name + ' 获胜！') : '游戏结束';
        } else {
          ti.textContent = turnP ? ('轮到：' + turnP.name) : '—';
        }

        const tm = $('timerInfo');
        if (state.state === 'playing' && isMyTurn) tm.classList.remove('hidden');
        else tm.classList.add('hidden');

        $('startBtn').classList.toggle('hidden', !(state.state === 'lobby' && isHost));
        // 移动阶段点击高亮城市走一步，走完自动结束本回合
        const inLobby = state.state === 'lobby';
        const bots = state.players.filter(function (p) { return p.bot; }).length;
        const cap = state.max_players || 4;
        $('addBotBtn').classList.toggle('hidden', !(inLobby && isHost && state.players.length < cap));
        $('removeBotBtn').classList.toggle('hidden', !(inLobby && isHost && bots > 0));
        // 出发城市：等待阶段房主可改，其他人只读；开局后仅展示
        renderStartCityBar(isHost, inLobby);

        const canEnd = isMyTurn && state.phase === 'move';
        $('rollBtn').classList.toggle('hidden', !(isMyTurn && state.phase === 'roll'));
        $('endBtn').classList.toggle('hidden', !canEnd);
        $('rollBtn').disabled = !isMyTurn || state.phase !== 'roll';
        $('endBtn').disabled = !canEnd;
        $('endBtn').textContent = (state.moved ? '结束回合' : '结束回合（不移动）');

        const da = $('diceArea');
        if (state.last_roll && state.last_roll.length) {
          da.innerHTML = state.last_roll.map(function (f) {
            if (f === 'go') return '<div class="die wild">GO</div>';
            return '<div class="die" style="background:' + colorHex(f) + '">' + colorName(f) + '</div>';
          }).join('');
        } else {
          da.innerHTML = '';
        }

        // 移动阶段提示：每回合只能走一步，走完自动结束本回合
        const hint = $('moveHint');
        if (isMyTurn && state.phase === 'move') {
          const n = (state.moves || []).length;
          const multi = (state.steps_per_turn || 1) > 1;
          hint.textContent = n
            ? (multi ? '🖱 点击高亮城市走一步（本回合还能走 ' + (state.steps_left || 0) + ' 步）'
                     : '🖱 点击高亮城市走一步（走完自动结束本回合）')
            : '🚫 没有可走的线路了，点“结束回合”继续';
          hint.classList.remove('hidden');
        } else {
          hint.classList.add('hidden');
        }
      }

      // 对局中的出发城市栏：等待阶段房主可改，开局后只读展示
      function renderStartCityBar(isHost, inLobby) {
        const bar = $('startCityBar');
        if (!bar || bar.classList.contains('hidden')) return;
        const sel = $('startCitySelect2');
        sel.disabled = !(isHost && inLobby);
        const cur = state.start_city === 'random' ? 'random' : (state.start_city || MAP.start);
        if (sel.value !== cur) sel.value = cur;
        $('startCityTag').textContent = inLobby
          ? (isHost ? '（你是房主，可修改）' : '（由房主设置）')
          : '已出发：' + (cur === 'random' ? '随机' : cur);
      }

      function render() {
        if (!state) return;
        const cob = $('cardOnlyBtn');
        if (cob) { cob.classList.remove('hidden'); cob.classList.toggle('filter-on', cardOnly); }
        // 球面视图由 Canvas 渲染（自带动画循环），平面视图走 SVG
        if (viewMode === 'globe') { syncGlobeStart(); renderGlobe(); } else renderBoard();
        renderSidebar();
        renderControls();
        maybeShowEnd();
      }

      // 一局结束：弹出战报并询问"再来一局"（同一房间重开，成绩清零，仅弹一次）
      let endShownFor = null;
      function maybeShowEnd() {
        const mask = $('endMask');
        if (!mask) return;
        if (state && state.state === 'finished') {
          if (endShownFor === state.room_id) return;
          endShownFor = state.room_id;
          const rank = state.players.slice().sort(function (a, b) { return (b.score || 0) - (a.score || 0); });
          $('endTitle').textContent = rank.length ? '🎉 ' + (rank[0].name || '玩家') + ' 获胜！' : '🎉 游戏结束';
          $('endBoard').innerHTML = rank.map(function (p, i) {
            return '<div class="end-row' + (i === 0 ? ' first' : '') + '">' +
              '<span class="dot" style="background:' + colorHex(p.color) + '"></span>' +
              '<b>' + esc(p.name || '玩家') + '</b><span>' + (p.score || 0) + ' 分</span>' +
              '<span class="muted">秘密目的地 ' + esc(cityLabel(p.secret)) + '</span></div>';
          }).join('');
          const isHost = !!(myPid && state.host_pid === myPid);
          $('rematchBtn').classList.toggle('hidden', !isHost);
          const w = $('endWait');
          w.classList.toggle('hidden', isHost);
          w.textContent = '⏳ 等待房主开始新一局…';
          mask.classList.remove('hidden');
        } else {
          mask.classList.add('hidden');
          if (!state || state.state === 'playing') endShownFor = null;   // 重开后允许下局再弹
        }
      }

      function startTimerTicker() {
        if (timerInt) clearInterval(timerInt);
        timerInt = setInterval(function () {
          if (!state || state.state !== 'playing') return;
          const m = me();
          const isMyTurn = m && state.current_pid === myPid;
          if (isMyTurn && timerLeft > 0) {
            timerLeft--;
            $('timerInfo').textContent = '⏱ ' + timerLeft + 's（超时自动行动）';
          }
        }, 1000);
      }

      function initSocket() {
        const base = serverBase();
        // 强制 polling：部分代理环境会破坏 WebSocket 升级（Bad HTTP/0.9 request type）
        const opts = { transports: ['polling'] };
        // 每款棋一个 Socket.IO 命名空间，房间号互不干扰
        socket = base ? io(base + '/' + GAME_ID, opts) : io('/' + GAME_ID, opts);
        socket.on('connect', function () {
          connBadge.classList.remove('bad'); connBadge.classList.add('good');
          connBadge.textContent = '● 已连接服务器';
          if (joined && myRoom && myPid) {
            socket.emit('rejoin', { room_id: myRoom, player_id: myPid });
          }
        });
        socket.on('disconnect', function () {
          connBadge.classList.remove('good'); connBadge.classList.add('bad');
          connBadge.textContent = '● 连接已断开';
        });
        socket.io.on('reconnect_attempt', function () {
          connBadge.classList.remove('good'); connBadge.classList.add('bad');
          connBadge.textContent = '● 正在连接服务器…（失败请检查后端是否启动）';
        });
        socket.on('connect_error', function (err) {
          connBadge.classList.remove('good'); connBadge.classList.add('bad');
          connBadge.textContent = '● 连接失败：请确认后端已启动（python server.py），并检查服务器地址';
        });
        socket.on('created', function (d) {
          myRoom = d.room_id; myPid = d.player_id; joined = true;
          saveCreds(); showScreen('game'); toast('房间已创建：' + myRoom);
        });
        socket.on('joined', function (d) {
          myRoom = d.room_id; myPid = d.player_id; joined = true;
          saveCreds(); showScreen('game'); toast('已加入房间：' + myRoom);
        });
        socket.on('rejoined', function () { showScreen('game'); toast('已重新连接'); });
        socket.on('state', function (s) {
          state = s; timerLeft = s.timer_remaining || 0; render();
        });
        socket.on('error', function (e) {
          const msg = (e && e.msg) || '出错了';
          toast(msg);
          if (!lobby.classList.contains('hidden')) {
            lobbyMsg.textContent = '❌ ' + msg;
            lobbyMsg.classList.remove('hidden');
          }
          if (msg.indexOf('恢复') >= 0 || msg.indexOf('重新加入') >= 0) {
            try { localStorage.removeItem(STORE_KEY); } catch (e2) {}
            myRoom = null; myPid = null; joined = false;
            $('rejoinBox').classList.add('hidden');
          }
        });
        socket.__base = serverBase();
      }

      // 服务器地址变化时，关闭旧连接并按新地址重建（地图缓存同时作废）
      function ensureSocket() {
        const base = serverBase();
        if (socket && socket.__base === base) return;
        if (socket) { try { socket.close(); } catch (e) {} socket = null; }
        MAP = null; ADJ = {};
        initSocket();
      }

      function saveCreds() {
        try { localStorage.setItem(STORE_KEY, JSON.stringify({ room: myRoom, pid: myPid })); } catch (e) {}
      }
      function loadCreds() {
        try { return JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { return null; }
      }

      function validateName() {
        const n = $('nameInput').value.trim();
        if (!n) { toast('请填写昵称'); return null; }
        return n;
      }

      async function ensureMap() {
        if (MAP) return true;
        try {
          await loadMap();
          lobbyMsg.classList.add('hidden');
          return true;
        } catch (e) {
          lobbyMsg.textContent = '加载地图失败：' + e.message + '。请检查上方"服务器地址"是否为后端直连地址。';
          lobbyMsg.classList.remove('hidden');
          return false;
        }
      }

      $('createBtn').addEventListener('click', async function () {
        const name = validateName(); if (!name) return;
        ensureSocket();
        if (!(await ensureMap())) return;
        saveBase();
        const customRid = $('roomIdInput').value.trim();
        const payload = {
          name: name, password: $('createPwdInput').value, room_id: customRid,
          dice_count: 2, ai_level: $('aiSelect').value,
          timeout: parseInt($('timeoutSelect').value, 10),
          max_players: parseInt($('maxPlayersSelect').value, 10),
          bot_count: parseInt($('botCountSelect').value, 10)
        };
        // 开放规则：仅当该棋盘声明了可选项时才带上（如世界之旅的目标分/步数/出发城市）
        const ruleRow = $('ruleRow');
        if (ruleRow && !ruleRow.classList.contains('hidden')) {
          const ws = $('winScoreSelect'), st = $('stepsSelect');
          if (ws && ws.value) payload.win_score = parseInt(ws.value, 10);
          if (st && st.value) payload.steps_per_turn = parseInt(st.value, 10);
        }
        const startRow = $('startRow');
        if (startRow && !startRow.classList.contains('hidden')) {
          payload.start_city = $('startCitySelect').value;   // 'random' 表示开局随机揭晓
        }
        socket.emit('create_room', payload);
      });

      // 加入房间（房间号来自大厅列表点击；需要密码时由弹框提供）
      async function joinRoom(rid, password) {
        const name = validateName(); if (!name) return;
        if (!/^\d{4}$/.test(rid)) { toast('房间号不正确'); return; }
        ensureSocket();
        if (!(await ensureMap())) return;
        saveBase();
        socket.emit('join_room', { name: name, room_id: rid, password: password || '' });
      }

      $('joinPwdBtn').addEventListener('click', function () {
        const rid = $('roomInput').value.trim();
        $('joinPrompt').classList.add('hidden');
        joinRoom(rid, $('joinPwdInput').value);
      });
      $('cancelJoinBtn').addEventListener('click', function () {
        $('joinPrompt').classList.add('hidden');
      });
      $('joinPwdInput').addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') $('joinPwdBtn').click();
      });

      $('rejoinBtn').addEventListener('click', function () {
        if (myRoom && myPid) socket.emit('rejoin', { room_id: myRoom, player_id: myPid });
      });
      $('startBtn').addEventListener('click', function () {
        socket.emit('start_game', { room_id: myRoom, player_id: myPid });
      });
      $('addBotBtn').addEventListener('click', function () {
        socket.emit('add_bot', { room_id: myRoom, player_id: myPid });
      });
      $('removeBotBtn').addEventListener('click', function () {
        socket.emit('remove_bot', { room_id: myRoom, player_id: myPid });
      });
      $('rollBtn').addEventListener('click', function () {
        socket.emit('roll', { room_id: myRoom, player_id: myPid });
      });
      $('endBtn').addEventListener('click', function () {
        socket.emit('end_turn', { room_id: myRoom, player_id: myPid });
      });
      initBoardZoom();   // 平面地图：右上角 + / - / *（缩放与回到我所在的位置）

      // 建房人数：总人数最多 10 人；机器人最多 N-1（始终给真人留一个位置）
      function initPlayerCountSelects() {
        const ms = $('maxPlayersSelect'), bs = $('botCountSelect');
        if (!ms || !bs) return;
        const specMax = (GAME_SPEC && GAME_SPEC.max_players) ? GAME_SPEC.max_players : 10;
        const hardMax = Math.min(10, Math.max(2, specMax));
        ms.innerHTML = '';
        for (let n = 2; n <= hardMax; n++) {
          const o = document.createElement('option');
          o.value = String(n); o.textContent = n + ' 人';
          ms.appendChild(o);
        }
        ms.value = String(Math.min(4, hardMax));
        const syncBots = function (keepValue) {
          const n = parseInt(ms.value, 10);
          const cur = keepValue ? parseInt(bs.value, 10) : NaN;
          bs.innerHTML = '';
          for (let k = 0; k <= n - 1; k++) {
            const o = document.createElement('option');
            o.value = String(k); o.textContent = k === 0 ? '0（无机器人）' : String(k);
            bs.appendChild(o);
          }
          // 默认 N-1：一人开局其余全由机器人填充
          bs.value = String(isNaN(cur) ? n - 1 : Math.min(cur, n - 1));
        };
        // 用户手动选过机器人数量就尊重其选择；否则总人数一变就自动补到 N-1
        let touched = false;
        bs.addEventListener('change', function () { touched = true; });
        ms.addEventListener('change', function () { syncBots(touched); });
        syncBots(false);
      }
      // 房主在对局中改出发城市（仅等待阶段有效，服务端会校验）
      $('startCitySelect2').addEventListener('change', function () {
        if (!state || state.state !== 'lobby') return;
        socket.emit('set_start_city', {
          room_id: myRoom, player_id: myPid, start_city: $('startCitySelect2').value
        });
      });
      // 侧边栏面板：点标题折叠 / 展开（次要信息收起，给聊天等留空间）
      document.querySelector('.sidebar').addEventListener('click', function (e) {
        const h = e.target.closest('.panel h3');
        if (h) h.parentElement.classList.toggle('collapsed');
      });
      // 房间聊天：发送按钮 / 回车发送（Shift+回车换行会被裁剪掉，保持简洁）
      $('chatSendBtn').addEventListener('click', sendChat);
      $('chatInput').addEventListener('keydown', function (e) {
        if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); sendChat(); }
      });
      $('leaveBtn').addEventListener('click', function () {
        try { localStorage.removeItem(STORE_KEY); } catch (e) {}
        location.reload();
      });
      // 结束弹层：再来一局（房主）/ 退出房间
      $('rematchBtn').addEventListener('click', function () {
        socket.emit('start_game', { room_id: myRoom, player_id: myPid });
      });
      $('endLeaveBtn').addEventListener('click', function () {
        try { localStorage.removeItem(STORE_KEY); } catch (e) {}
        location.reload();
      });

      // 主题切换：亮色 ↔ 暗色（纯 CSS 类切换，不重算几何）
      const THEME_KEY = 'shanzhuan_theme';
      let themeDark = false;
      function applyTheme() {
        $('board').classList.toggle('dark', themeDark);
        const ba = document.querySelector('.board-area');
        if (ba) ba.classList.toggle('dark', themeDark);   // 缩放控件跟着一起变暗
        $('themeBtn').textContent = themeDark ? '🌙 暗色' : '🌞 亮色';
        try { localStorage.setItem(THEME_KEY, themeDark ? 'dark' : 'light'); } catch (e) {}
        if (viewMode === 'globe') renderGlobe();   // 球面配色随主题重绘
      }
      $('themeBtn').addEventListener('click', function () { themeDark = !themeDark; applyTheme(); });
      try { themeDark = localStorage.getItem(THEME_KEY) === 'dark'; } catch (e) {}

      // "只看城市卡"：地图（平面 / 球面）只显示城市卡上的城市，再点还原
      function applyCardOnly() {
        const b = $('cardOnlyBtn');
        if (b) b.classList.toggle('filter-on', cardOnly);
        try { localStorage.setItem(CARD_KEY, cardOnly ? '1' : '0'); } catch (e) {}
      }
      $('cardOnlyBtn').addEventListener('click', function () {
        cardOnly = !cardOnly;
        applyCardOnly();
        if (cardOnly && viewMode === 'globe' && state && MAP) {
          // 只有当卡片城市全在地球背面时才转过去，免得点了"没反应"；正面能看到就不动视角
          const all = Array.from(cityView().cards).filter(function (c) { return MAP.geo[c]; });
          const front = all.filter(function (c) {
            return projectVec(MAP.geo[c][0], MAP.geo[c][1]).z > 0.03;
          });
          if (all.length && !front.length) { GLOBE.init = false; centerGlobeOn(all[0]); }
        }
        toast(cardOnly ? '👁 只看城市卡上的城市' : '👁 已还原全部城市');
        if (state) render();
      });
      try { cardOnly = localStorage.getItem(CARD_KEY) === '1'; } catch (e) {}
      applyCardOnly();

      // 视图切换：平面地图 ↔ 球面地球（仅支持球面的棋盘才显示该按钮）
      $('viewBtn').addEventListener('click', function () {
        viewMode = (viewMode === 'globe') ? 'flat' : 'globe';
        applyView();
      });
      // 球面风格：每个玩家本地切换（写实 / 夜景 / 卡通），不影响其他玩家
      $('globeStyleSel').addEventListener('change', function () {
        applyGlobeStyle($('globeStyleSel').value);
        renderGlobe();
      });
      try { if (localStorage.getItem(VIEW_KEY) === 'globe') viewMode = 'globe'; } catch (e) {}

      (async function boot() {
        try {
          const b = localStorage.getItem(SERVER_KEY) || '';
          if (b) $('serverInput').value = b;
        } catch (e) {}

        try { await loadMap(); }
        catch (e) {
          lobbyMsg.textContent = '加载地图失败：' + e.message + '。请在上方"服务器地址"填写后端直连地址（如 http://localhost:5000）后重试。';
          lobbyMsg.classList.remove('hidden');
        }
        await loadGameSpec();   // 元信息决定可用视图与可选规则
        initPlayerCountSelects();   // 元信息就绪后再生成人数 / 机器人数下拉
        initSocket();
        initGlobeInteractions();
        applyView();
        applyTheme();
        startTimerTicker();
        loadRooms();
        setInterval(loadRooms, 3000);
        $('refreshRoomsBtn').addEventListener('click', loadRooms);

        const creds = loadCreds();
        if (creds && creds.room && creds.pid) {
          myRoom = creds.room; myPid = creds.pid; joined = true;
          $('rejoinBox').classList.remove('hidden');
        }
      })();

      /* 大厅房间列表：轮询 /api/rooms（内容不变时跳过重渲染） */
      let lastRoomsJson = '';
      async function loadRooms() {
      const box = document.getElementById('roomList');
      if (!box || document.getElementById('lobby').classList.contains('hidden')) return;
      let list = null;
      try {
        const res = await fetch(serverBase() + '/api/rooms/' + GAME_ID);
        if (res.ok) list = (await res.json()).rooms;
      } catch (e) {}
      if (!list) { box.innerHTML = '<div class="room-empty">房间列表加载失败（请检查后端）</div>'; return; }
      const j = JSON.stringify(list);
      if (j === lastRoomsJson && box.children.length && !box.querySelector('.room-empty')) return;
      lastRoomsJson = j;
      if (!list.length) { box.innerHTML = '<div class="room-empty">暂无可加入的房间，可以先"创建房间"</div>'; return; }
      box.innerHTML = '';
      let dimHead = null;
      list.forEach(function (r) {
        const div = document.createElement('div');
        // 不可加入的（进行中/已满/已结束）灰显在列表末尾：房间还在，只是不能进
        if (!r.joinable) {
          if (!dimHead) {
            dimHead = document.createElement('div');
            dimHead.className = 'room-dim-head';
            dimHead.textContent = '—— 以下房间不可加入 ——';
            box.appendChild(dimHead);
          }
          div.className = 'room-item dim';
          const why = r.state === 'playing' ? '🎲 游戏进行中'
            : (r.state === 'finished' ? '🏁 已结束' : '🚫 已满员');
          const people = r.humans + ' 人类 · ' + r.bots + ' 机器人';
          div.innerHTML = '<span class="rid">' + r.room_id + '</span>' +
            '<span class="meta">👤 ' + (r.creator || '房主') + ' 创建 · ' + why + '<br>' +
            '当前 ' + people + ' / 共 ' + r.max_players + ' 人</span>';
          div.addEventListener('click', function () {
            toast(why + '：不能加入。若这是你的房间，请在原标签页继续，或等房主"再来一局"。');
          });
          box.appendChild(div);
          return;
        }
        div.className = 'room-item';
        div.dataset.rid = r.room_id;
        div.dataset.pwd = r.has_password ? '1' : '';
        const pwd = r.has_password ? '🔒 有密码' : '🔓 无密码';
        const people = r.humans + ' 人类 · ' + r.bots + ' 机器人';
        const start = r.start_city ? ' · 🛫 ' + (r.start_city === 'random' ? '🎲 随机出发' : r.start_city) : '';
        div.innerHTML = '<span class="rid">' + r.room_id + '</span>' +
          '<span class="meta">👤 ' + (r.creator || '房主') + ' 创建 · ' + pwd + start + '<br>' +
          '当前 ' + people + ' / 共 ' + r.max_players + ' 人</span>';
        box.appendChild(div);
      });
      }

      // 事件委托：点击列表中的房间直接加入；有密码则弹出密码框
      // 灰显（进行中/已满/已结束）的房间不可加入，由它们自己的提示处理
      $('roomList').addEventListener('click', function (ev) {
        const item = ev.target.closest('.room-item');
        if (!item || item.classList.contains('dim') || !item.dataset.rid) return;
        const rid = item.dataset.rid;
        $('roomInput').value = rid;
        if (item.dataset.pwd) {
          $('joinPromptRoom').textContent = rid;
          $('joinPwdInput').value = '';
          $('joinPrompt').classList.remove('hidden');
          $('joinPwdInput').focus();
        } else {
          joinRoom(rid, '');
        }
      });
    }

    /* Socket.IO 客户端已内联，直接启动应用 */
    window.__ioLoaded = true;
    startApp();
  </script>
</body>
</html>
