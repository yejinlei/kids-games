<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>山河之旅 · 儿童桌游</title>
  <style>
    :root {
      --bg: #eaf4ff;
      --panel: #ffffff;
      --ink: #2c3e50;
      --muted: #7f8c9b;
      --primary: #ff7a59;
      --primary-d: #ef5e3a;
      --accent: #2ecc71;
      --line: #d8e3ef;
      --shadow: 0 6px 18px rgba(40, 80, 140, .12);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #fff 0%, var(--bg) 60%);
      color: var(--ink);
      min-height: 100vh;
    }
    .hidden { display: none !important; }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 20px; background: #fff; box-shadow: var(--shadow);
      position: sticky; top: 0; z-index: 10;
    }
    .logo { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
    .room-tag {
      background: #eef6ff; color: #2b6cb0; padding: 6px 12px; border-radius: 999px;
      font-weight: 700; font-size: 14px;
    }
    .screen { padding: 20px; max-width: 1600px; margin: 0 auto; }
    .lobby-card {
      background: var(--panel); border-radius: 20px; padding: 28px;
      box-shadow: var(--shadow); max-width: 480px; margin: 30px auto;
    }
    .lobby-card h1 { margin: 0 0 6px; font-size: 26px; }
    .subtitle { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
    label { display: block; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
    input, select {
      width: 100%; padding: 10px 12px; border: 1.5px solid var(--line);
      border-radius: 12px; font-size: 15px; outline: none; background: #fbfdff;
    }
    input:focus, select:focus { border-color: var(--primary); }
    .row { display: flex; gap: 12px; }
    .row label { flex: 1; }
    hr { border: none; border-top: 1px dashed var(--line); margin: 20px 0; }
    .btn-group { margin-top: 14px; }
    .btn {
      border: none; border-radius: 14px; padding: 12px 18px; font-size: 15px;
      font-weight: 700; cursor: pointer; background: #eef2f7; color: var(--ink);
      transition: transform .06s ease, filter .15s ease; width: 100%;
    }
    .btn:hover { filter: brightness(1.03); }
    .btn:active { transform: translateY(1px); }
    .btn.primary { background: var(--primary); color: #fff; }
    .btn.primary:hover { background: var(--primary-d); }
    .btn.ghost { background: #fff; border: 1.5px solid var(--line); margin-top: 10px; }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .msg { text-align: center; color: var(--primary-d); margin-top: 14px; font-weight: 700; }
    .conn-badge {
      position: fixed; top: 12px; right: 12px; z-index: 999;
      padding: 6px 12px; border-radius: 999px; font-size: 12px; font-weight: 700;
      background: #fff; box-shadow: var(--shadow); border: 1.5px solid var(--line);
    }
    .conn-badge.good { color: #1a7f37; border-color: #1a7f37; }
    .conn-badge.bad { color: #c2410c; border-color: #c2410c; }
    .conn-badge.init { color: #666; }
    .rejoin-box { margin-top: 16px; padding: 14px; background: #fff7f3; border-radius: 14px; text-align: center; }
    .room-list-box { margin-top: 4px; }
    .room-list-head { display: flex; justify-content: space-between; align-items: center; font-weight: 700; font-size: 14px; color: var(--ink-2, #444); }
    .btn.tiny { padding: 4px 12px; font-size: 12px; margin-top: 0; }
    .static-field { padding: 11px 12px; border: 1.5px solid var(--line); border-radius: 10px; background: #f7f7f7; color: #555; font-size: 14px; }
    .tip { margin-top: 8px; font-size: 12px; color: #777; line-height: 1.5; }
    .section-title { margin: 4px 0 10px; font-weight: 800; font-size: 15px; color: var(--primary-d, #c2410c); }
    .room-list { margin-top: 10px; display: grid; gap: 8px; max-height: 180px; overflow-y: auto; }
    .room-item {
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
      padding: 10px 14px; border: 1.5px solid var(--line); border-radius: 12px;
      background: #fff; cursor: pointer; font-size: 14px;
    }
    .room-item:hover { border-color: var(--primary, #ff6b35); background: #fff7f3; }
    .room-item .rid { font-weight: 800; font-size: 16px; letter-spacing: 2px; }
    .room-item .meta { color: #777; font-size: 12px; }
    .room-empty { text-align: center; color: #999; font-size: 13px; padding: 12px; }

    #game { display: grid; grid-template-columns: 1fr 320px; gap: 20px; align-items: start; }
    .board-wrap {
      background: var(--panel); border-radius: 20px; padding: 16px; box-shadow: var(--shadow);
    }
    .board-wrap svg { background: #e3f1fb; border-radius: 14px; display: block; width: 100%; max-width: 1500px; margin: 0 auto; }
    .land { fill: #eef6ea; stroke: #a9c0a4; stroke-width: 1.5; stroke-linejoin: round; }
    .route { stroke-width: 4; opacity: .5; }
    .route.reach { opacity: 1; stroke-width: 6; stroke-dasharray: 2 6; }
    .city-label { font-size: 13px; fill: #333; font-weight: 700; paint-order: stroke; stroke: #fff; stroke-width: 3px; }
    .city.reach .city-circle { stroke: var(--primary, #ff6b35); stroke-width: 3; }
    .city-label .cost { fill: var(--primary, #ff6b35); font-size: 9px; font-weight: 800; }
    .move-path { fill: none; stroke: #ff6b35; stroke-width: 4; stroke-linecap: round; opacity: .85; }
    .move-hint { text-align: center; margin-top: 10px; font-size: 13px; font-weight: 700; color: var(--primary-d, #c2410c); }
    /* 旗杆 + 旗帜定位标记（所有玩家统一） */
    .pawn-pole { opacity: .9; }
    .pawn-flag { transform-box: fill-box; transform-origin: 0% 50%; animation: pawnWave 2.4s ease-in-out infinite; }
    @keyframes pawnWave {
      0%, 100% { transform: rotate(-4deg); }
      50%      { transform: rotate(4deg); }
    }
    .pawn-tag { font-size: 11px; font-weight: 800; fill: var(--primary, #ff6b35); stroke: #fff; stroke-width: 2.5px; paint-order: stroke; }
    .pawn-other-tag { font-size: 9px; font-weight: 700; fill: #666; stroke: #fff; stroke-width: 2.5px; paint-order: stroke; }
    .city.shared .city-circle { fill: #fff3cd; stroke: #e0a800; }
    .city.secret .city-circle { stroke: #9b59b6; stroke-width: 3; stroke-dasharray: 3 2; }
    .board-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
    .turn-info { font-weight: 800; font-size: 16px; }
    .timer { background: #fff3cd; color: #8a6d00; padding: 4px 12px; border-radius: 999px; font-weight: 800; }
    .board {
      position: relative; width: 100%; aspect-ratio: 1000 / 720;
      background: linear-gradient(180deg, #d6ecff, #eaf6ff);
      border-radius: 16px; overflow: hidden;
    }
    .board svg { width: 100%; height: 100%; display: block; }
    .head-right { display: flex; align-items: center; gap: 8px; }
    .btn.small { padding: 6px 12px; font-size: 13px; }
    /* 暗色夜视主题：背景与文字反色，线路/棋子颜色保持不变，清晰可读 */
    .board.dark { background: linear-gradient(180deg, #0f1b30, #0a1322); }
    .board.dark svg { background: #0f1d33; }
    .board.dark .land { fill: #16263f; stroke: #2c4a6e; }
    /* 线路保留各自的彩色描边（不覆盖 stroke），只提高亮度让深底下更醒目 */
    .board.dark .route { opacity: .9; }
    .board.dark .route.reach { filter: drop-shadow(0 0 6px rgba(255,179,0,.95)); }
    .board.dark .city-circle { stroke: #33425a; }
    .board.dark .city-label { fill: #e8eef6; stroke: #0a1322; }
    .board.dark .pawn-other-tag { fill: #cdd6e2; stroke: #0a1322; }
    .action-bar {
      display: flex; gap: 12px; margin-top: 12px; flex-wrap: wrap;
      position: sticky; bottom: 0; background: var(--panel);
      padding: 10px 0 6px; z-index: 6;
    }
    .action-bar .btn { width: auto; flex: 1; }
    .board-area { position: relative; }
    .dice-area {
      position: absolute; right: 14px; bottom: 14px; z-index: 5;
      display: flex; gap: 10px; justify-content: flex-end; pointer-events: none;
    }
    .die {
      width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center;
      justify-content: center; font-weight: 800; color: #fff; box-shadow: var(--shadow); font-size: 14px;
    }
    .die.wild { background: #444; }

    .sidebar { display: flex; flex-direction: column; gap: 14px; }
    .panel { background: var(--panel); border-radius: 16px; padding: 14px; box-shadow: var(--shadow); }
    .panel h3 { margin: 0 0 10px; font-size: 15px; }
    .player-list { display: flex; flex-direction: column; gap: 8px; }
    .player {
      display: flex; align-items: center; flex-wrap: wrap; gap: 4px 10px; padding: 8px 10px; border-radius: 12px;
      background: #f7fafd; border: 2px solid transparent;
    }
    .player .pcards { flex-basis: 100%; font-size: 12px; color: #555; }
    .player.current { border-color: var(--accent); background: #f0fff6; }
    .player .dot { width: 16px; height: 16px; border-radius: 50%; flex: none; }
    .player .pname { font-weight: 700; flex: 1; }
    .player .pscore { font-weight: 800; color: var(--primary-d); }
    .player .goal { font-size: 12px; color: var(--muted); }
    .player .offline { font-size: 11px; color: #b00; }
    .cards { display: flex; gap: 8px; flex-wrap: wrap; }
    .cardchip {
      background: #fff7e6; border: 1.5px solid #ffd591; border-radius: 12px;
      padding: 8px 10px; text-align: center; min-width: 64px;
    }
    .cardchip .ccity { font-weight: 800; font-size: 14px; }
    .cardchip .cpts { font-size: 12px; color: var(--primary-d); font-weight: 700; }
    .cardchip.empty { color: var(--muted); border-style: dashed; background: #fafafa; }
    .cardchip { position: relative; text-align: center; }
    .cardchip .cno { font-size: 11px; color: #999; font-weight: 700; }
    .cardchip.secret { border-color: #9b59b6; background: #f6f0fb; }
    .cardchip.secret .ccity { color: #6b3fa0; }
    .cardchip.secret .cpts { color: #6b3fa0; }
    .pcard { font-size: 11px; color: #8e6bb0; white-space: nowrap; }
    .tickets { display: flex; gap: 6px; flex-wrap: wrap; }
    .ticket {
      display: flex; align-items: center; gap: 4px; padding: 4px 8px; border-radius: 999px;
      background: #f2f6fb; font-weight: 800; font-size: 13px; border: 1.5px solid var(--line);
    }
    .ticket .swatch { width: 12px; height: 12px; border-radius: 3px; }
    .ticket.wild { background: #eee; }
    .log {
      max-height: 180px; overflow-y: auto; font-size: 13px; color: #46566a; line-height: 1.5;
      display: flex; flex-direction: column; gap: 4px;
    }
    .log div { padding: 2px 0; border-bottom: 1px dashed #eef2f7; }

    .route { stroke-width: 1.4; stroke-linecap: round; opacity: .65; }
    .route.reach { stroke-width: 4; opacity: 1; filter: drop-shadow(0 0 4px #ffb300); }
    .city-node { cursor: default; }
    .city-circle { stroke: #fff; stroke-width: 2; }
    .city-label { font-size: 11px; font-weight: 400; fill: #2c3e50; paint-order: stroke;
      stroke: #fff; stroke-width: 2.5px; pointer-events: none; }
    .city.reach .city-circle { stroke: #ffb300; stroke-width: 4; cursor: pointer; }
    .city.shared .city-circle { stroke: #ff7a59; stroke-width: 4; }
    .city.secret .city-circle { stroke: #2ecc71; stroke-width: 4; stroke-dasharray: 4 3; }
    .toast {
      position: fixed; left: 50%; bottom: 30px; transform: translateX(-50%);
      background: #2c3e50; color: #fff; padding: 10px 18px; border-radius: 999px;
      font-weight: 700; box-shadow: var(--shadow); z-index: 50;
    }
    /* 地图优先：宽度不足时侧边栏移到地图下方，并横向排布，保证地图尽量大 */
    @media (max-width: 1500px) {
      #game { grid-template-columns: 1fr; }
      .sidebar {
        display: grid; gap: 16px; align-items: start;
        grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="logo">🏔️ 山河之旅</div>
    <div id="roomTag" class="room-tag hidden"></div>
  </header>

  <!-- 大厅 / 等待室 -->
  <main id="lobby" class="screen">
    <div class="card lobby-card">
      <h1>欢迎来到《山河之旅》</h1>
      <p class="subtitle">2-4 人 · 中国地理启蒙桌游 · 从北京出发，收集城市卡！</p>

      <label>服务器地址（留空 = 当前页面地址）
        <input id="serverInput" placeholder="例如：http://localhost:5000" />
      </label>

      <label>你的昵称
        <input id="nameInput" maxlength="12" placeholder="例如：小明" value="" />
      </label>

      <div class="row">
        <label>每回合
          <div class="static-field">掷 2 颗骰子（官方玩法）</div>
        </label>
        <label>回合超时（秒）
          <select id="timeoutSelect">
            <option value="20">20</option>
            <option value="30" selected>30</option>
            <option value="45">45</option>
            <option value="60">60</option>
          </select>
        </label>
      </div>

      <div class="row">
        <label>自定义房间号（可选）
          <input id="roomIdInput" maxlength="4" placeholder="留空随机" inputmode="numeric" />
        </label>
        <label>房间密码（可选）
          <input id="createPwdInput" maxlength="16" placeholder="留空无密码" />
        </label>
      </div>

      <div class="row">
        <label>总人数
          <select id="maxPlayersSelect">
            <option value="2">2 人</option>
            <option value="3">3 人</option>
            <option value="4" selected>4 人</option>
          </select>
        </label>
        <label>机器人
          <select id="botCountSelect">
            <option value="0" selected>0（无机器人）</option>
            <option value="1">1</option>
            <option value="2">2</option>
            <option value="3">3</option>
          </select>
        </label>
      </div>

      <label>机器人难度
        <select id="aiSelect">
          <option value="normal" selected>普通（会算路线、抢城市卡）</option>
          <option value="easy">简单（偶尔走错）</option>
        </select>
      </label>

      <div class="btn-group">
        <button id="createBtn" class="btn primary">创建房间</button>
      </div>

      <hr/>

      <div class="room-list-box">
        <div class="room-list-head">
          <span>可加入的房间（等待中）</span>
          <button id="refreshRoomsBtn" class="btn tiny">刷新</button>
        </div>
        <div id="roomList" class="room-list"><div class="room-empty">加载中…</div></div>
      </div>

      <hr/>

      <input id="roomInput" type="hidden" />

      <div id="joinPrompt" class="rejoin-box hidden">
        <p>房间 <b id="joinPromptRoom"></b> 需要密码：</p>
        <input id="joinPwdInput" maxlength="16" placeholder="请输入房间密码" />
        <div class="btn-group">
          <button id="joinPwdBtn" class="btn primary">加入房间</button>
          <button id="cancelJoinBtn" class="btn ghost">取消</button>
        </div>
      </div>

      <div id="rejoinBox" class="rejoin-box hidden">
        <p>检测到你上局未完成，可一键回到游戏：</p>
        <button id="rejoinBtn" class="btn primary">回到游戏</button>
      </div>
    </div>

    <div id="lobbyMsg" class="msg hidden"></div>
  </main>

  <div id="connBadge" class="conn-badge init">● 正在连接服务器…</div>

  <!-- 游戏室 -->
  <main id="game" class="screen hidden">
    <section class="board-wrap">
      <div class="board-head">
        <span id="turnInfo" class="turn-info">准备中…</span>
        <span class="head-right">
          <button id="themeBtn" class="btn ghost small" title="切换主题（亮色 / 暗色）">🌞 亮色</button>
          <span id="timerInfo" class="timer hidden"></span>
        </span>
      </div>
      <div class="board-area">
        <div id="board" class="board"></div>
        <div id="diceArea" class="dice-area"></div>
      </div>
      <div id="moveHint" class="move-hint hidden"></div>
      <div class="action-bar">
        <button id="addBotBtn" class="btn hidden">🤖 添加机器人</button>
        <button id="removeBotBtn" class="btn ghost hidden">移除机器人</button>
        <button id="startBtn" class="btn primary hidden">开始游戏</button>
        <button id="rollBtn" class="btn primary hidden">🎲 掷骰子</button>
        <button id="endBtn" class="btn hidden">结束回合</button>
      </div>
    </section>

    <aside class="sidebar">
      <div class="panel">
        <h3>玩家</h3>
        <div id="playerList" class="player-list"></div>
      </div>
      <div class="panel">
        <h3>城市卡（每人 4 张）</h3>
        <div id="sharedCards" class="cards"></div>
        <p class="tip">①②③ 为<b>公共卡</b>，所有人可见——只有本回合移动后<b>停留的城市</b>与卡面相同，才能获得该卡分数（取走后翻开新卡）。<br/>④ 为你的<b>秘密目的地</b>，只有你自己看得到；别人只能看到一张背面 🎴。</p>
      </div>
      <div class="panel">
        <h3>我的车票</h3>
        <div id="ticketBox" class="tickets"></div>
      </div>
      <div class="panel">
        <h3>游戏日志</h3>
        <div id="logBox" class="log"></div>
      </div>
      <button id="leaveBtn" class="btn ghost">退出房间</button>
    </aside>
  </main>

  <div id="toast" class="toast hidden"></div>

  <script>
/* Socket.IO 客户端 4.8.2（内联，避免代理拦截外部脚本） */

  </script>
  <script>
    /* 应用逻辑（内联，避免代理拦截外部 js/css） */
    function startApp() {
      const STORE_KEY = 'shanhe_trip';
      const SERVER_KEY = 'shanhe_trip_server';
      let socket = null;
      let MAP = null;
      let ADJ = {};
      let POS = {};          // 城市投影坐标 {name:{x,y}}
      let BORDER_PATH = '';  // 中国轮廓 SVG 路径
      let state = null;
      let myPid = null;
      let myRoom = null;
      let joined = false;
      let timerLeft = 0;
      let timerInt = null;

      const $ = (id) => document.getElementById(id);
      const lobby = $('lobby'), game = $('game');
      const lobbyMsg = $('lobbyMsg');
      const connBadge = $('connBadge');

      function showScreen(name) {
        lobby.classList.toggle('hidden', name !== 'lobby');
        game.classList.toggle('hidden', name !== 'game');
      }
      function toast(msg) {
        const t = $('toast');
        t.textContent = msg;
        t.classList.remove('hidden');
        clearTimeout(toast._t);
        toast._t = setTimeout(() => t.classList.add('hidden'), 2200);
      }
      function colorHex(c) {
        if (c === 'go') return '#444';
        return (MAP.colors[c] && MAP.colors[c].hex) || '#999';
      }
      function colorName(c) {
        if (c === 'go') return 'GO';
        return (MAP.colors[c] && MAP.colors[c].name) || c;
      }
      function me() {
        if (!state || !myPid) return null;
        return state.players.find((p) => p.pid === myPid) || null;
      }

      function serverBase() {
        let b = '';
        const el = $('serverInput');
        if (el && el.value.trim()) b = el.value.trim();
        else { try { b = localStorage.getItem(SERVER_KEY) || ''; } catch (e) {} }
        return b.trim().replace(/\/+$/, '');
      }
      function saveBase() {
        try { localStorage.setItem(SERVER_KEY, serverBase()); } catch (e) {}
      }

      async function loadMap() {
        const base = serverBase();
        const ctrl = new AbortController();
        const t = setTimeout(function () { ctrl.abort(); }, 5000);
        let res;
        try {
          res = await fetch(base + '/api/map', { signal: ctrl.signal });
        } finally {
          clearTimeout(t);
        }
        if (!res.ok) throw new Error('HTTP ' + res.status + ' ' + (res.statusText || ''));
        MAP = await res.json();
        ADJ = {};
        Object.keys(MAP.cities).forEach((c) => (ADJ[c] = []));
        MAP.routes.forEach(function (r) {
          const a = r[0], b = r[1], color = r[2], cost = r[3];
          ADJ[a].push({ to: b, color: color, cost: cost });
          ADJ[b].push({ to: a, color: color, cost: cost });
        });
        computeProjection();
      }

      // 城市名标签避让：为每座城市挑一个不与已有标签重叠的位置
      function placeLabels() {
        // 个别城市的标签位置手工指定，优先于自动避让
        const overrides = {
          '敦煌': { dx: -13, dy: 4, anchor: 'end' },  // 放到城市点左侧，避开三线交汇处
          '洛阳': { dx: -13, dy: 4, anchor: 'end' },  // 郑州以西
          '苏州': { dx: 0, dy: 20, anchor: 'middle' }, // 沪宁之间，放下方
          '遵义': { dx: 14, dy: 4, anchor: 'start' },  // 贵阳以北，放右侧
          '大理': { dx: -13, dy: 4, anchor: 'end' },  // 丽江以南、昆明以西
          '呼伦贝尔': { dx: -13, dy: 4, anchor: 'end' }, // 哈尔滨西北
        };
        const opts = [
          { dx: 0, dy: -12, anchor: 'middle' },
          { dx: 0, dy: 20, anchor: 'middle' },
          { dx: 14, dy: 4, anchor: 'start' },
          { dx: -14, dy: 4, anchor: 'end' },
          { dx: 0, dy: -26, anchor: 'middle' },
          { dx: 0, dy: 34, anchor: 'middle' },
        ];
        const placed = [];
        Object.keys(POS).sort((a, b) => POS[a].y - POS[b].y).forEach(function (name) {
          const p = POS[name];
          const list = overrides[name] ? [overrides[name]].concat(opts) : opts;
          for (let i = 0; i < list.length; i++) {
            const o = list[i];
            const lx = p.x + o.dx, ly = p.y + o.dy;
            const clash = placed.some(function (q) {
              return Math.abs(q.x - lx) < 44 && Math.abs(q.y - ly) < 15;
            });
            if (!clash) {
              p.lx = lx; p.ly = ly; p.anchor = o.anchor;
              placed.push({ x: lx, y: ly });
              return;
            }
          }
          p.lx = p.x; p.ly = p.y - 12; p.anchor = 'middle';
          placed.push({ x: p.x, y: p.y - 12 });
        });
      }

      // 把经纬度等距投影到 1000x720 画布，并生成中国轮廓路径
      function computeProjection() {
        const geo = MAP.geo, border = MAP.border;
        const W = 1000, H = 720, pad = 55;
        const k = Math.cos(35 * Math.PI / 180);
        const raw = (lon, lat) => [(lon - 71) * k, (54 - lat)];
        const pts = [];
        Object.keys(geo).forEach((c) => pts.push(raw(geo[c][0], geo[c][1])));
        border.forEach((p) => pts.push(raw(p[0], p[1])));
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        pts.forEach((p) => {
          minX = Math.min(minX, p[0]); maxX = Math.max(maxX, p[0]);
          minY = Math.min(minY, p[1]); maxY = Math.max(maxY, p[1]);
        });
        const s = Math.min((W - 2 * pad) / (maxX - minX), (H - 2 * pad) / (maxY - minY));
        const toXY = (lon, lat) => {
          const r = raw(lon, lat);
          return { x: pad + (r[0] - minX) * s, y: pad + (r[1] - minY) * s };
        };
        POS = {};
        Object.keys(geo).forEach((c) => (POS[c] = toXY(geo[c][0], geo[c][1])));
        placeLabels();
        BORDER_PATH = border.map(function (p, i) {
          const q = toXY(p[0], p[1]);
          return (i ? 'L' : 'M') + q.x.toFixed(1) + ' ' + q.y.toFixed(1);
        }).join(' ') + ' Z';
      }

      function renderBoard() {
        const board = $('board');
        const W = 1000, H = 720;
        const my = me();
        const myPos = my ? my.position : null;
        // 官方规则：可沿同色线路连续走多段，可达范围由服务器计算
        const reachSet = new Set();
        const reachInfo = {};
        if (my && state.phase === 'move' && state.moves) {
          state.moves.forEach(function (m) {
            reachSet.add(m.to);
            const prev = reachInfo[m.to];
            if (!prev || m.cost < prev.cost) reachInfo[m.to] = m;
          });
        }

        let routesSvg = '';
        MAP.routes.forEach(function (r) {
          const a = r[0], b = r[1], color = r[2];
          const ca = POS[a], cb = POS[b];
          const isReach = (myPos === a && reachSet.has(b)) || (myPos === b && reachSet.has(a));
          const cls = 'route' + (isReach ? ' reach' : '');
          routesSvg += '<line class="' + cls + '" x1="' + ca.x + '" y1="' + ca.y +
            '" x2="' + cb.x + '" y2="' + cb.y + '" stroke="' + colorHex(color) + '" />';
        });

        const sharedCities = (state.shared_cards || []).map(function (c) { return c.city; }).filter(Boolean);
        const mySecret = my ? my.secret : null;
        let citiesSvg = '';
        Object.keys(POS).forEach(function (name) {
          const c = POS[name];
          let cls = 'city';
          if (reachSet.has(name)) cls += ' reach';
          if (sharedCities.indexOf(name) >= 0) cls += ' shared';
          if (name === mySecret) cls += ' secret';
          const r = name === '北京' ? 9 : 7;
          citiesSvg += '<g class="' + cls + '" data-city="' + name + '">' +
            '<circle class="city-circle" cx="' + c.x + '" cy="' + c.y + '" r="' + r + '" fill="#fff" stroke="#888" stroke-width="2"/>' +
            '<text class="city-label" x="' + c.lx + '" y="' + c.ly + '" text-anchor="' + c.anchor + '">' +
            name + (reachInfo[name] ? '<tspan class="cost">' + reachInfo[name].cost + '票</tspan>' : '') + '</text>' +
            '</g>';
        });

        const byCity = {};
        state.players.forEach(function (p) {
          (byCity[p.position] = byCity[p.position] || []).push(p);
        });
        let pawnsSvg = '';
        Object.keys(byCity).forEach(function (city) {
          // 自己的棋子画在最上层
          const list = byCity[city].slice().sort(function (a, b) {
            if (my && a.pid === my.pid) return 1;
            if (my && b.pid === my.pid) return -1;
            return 0;
          });
          const base = POS[city];
          const n = list.length;
          const spread = n > 1;
          list.forEach(function (p, i) {
            const px = spread ? base.x + (i - (n - 1) / 2) * 14 : base.x;
            const py = spread ? base.y - 15 : base.y;
            const isMine = my && p.pid === my.pid;
            // 旗杆 + 旗帜（所有玩家统一，无底部圆球）
            const top = py - 20;
            pawnsSvg += '<line class="pawn-pole" x1="' + px + '" y1="' + py + '" x2="' + px + '" y2="' + top + '" stroke="' +
              colorHex(p.color) + '" stroke-width="2"/>';
            pawnsSvg += '<path class="pawn-flag" d="M' + px + ' ' + top +
              ' L' + (px + 13) + ' ' + (top + 4) + ' L' + px + ' ' + (top + 8) + ' Z" fill="' +
              colorHex(p.color) + '" stroke="#fff" stroke-width="1.5"/>';
            if (isMine) {
              pawnsSvg += '<text class="pawn-tag" x="' + (px + 16) + '" y="' + (top + 7) + '" text-anchor="start">我</text>';
            }
          });
          // 同城所有对手的名字合并成一行，放在城市点下方
          const others = my ? list.filter(function (p) { return p.pid !== my.pid; }) : [];
          if (others.length) {
            const names = others.map(function (p) {
              return (p.name || '？') + (p.connected ? '' : '(离线)');
            }).join('、');
            pawnsSvg += '<text class="pawn-other-tag" x="' + base.x + '" y="' + (base.y + 19) + '" text-anchor="middle">' + names + '</text>';
          }
        });

        // 本回合已走过的路线（橙色虚线）
        let pathSvg = '';
        const mp = (state.move_path || []);
        if (mp.length > 1) {
          const pts = mp.map(function (c) { return POS[c].x + ',' + POS[c].y; }).join(' ');
          pathSvg = '<polyline class="move-path" points="' + pts + '" />';
        }

        const landSvg = '<path class="land" d="' + BORDER_PATH + '" />';
        board.innerHTML = '<svg viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="xMidYMid meet">' +
          landSvg + routesSvg + pathSvg + citiesSvg + pawnsSvg + '</svg>';

        board.querySelectorAll('.city.reach').forEach(function (g) {
          g.addEventListener('click', function () {
            const target = g.getAttribute('data-city');
            const info = reachInfo[target];
            socket.emit('move', {
              room_id: myRoom, player_id: myPid,
              neighbor: target, color: info ? info.color : undefined
            });
          });
        });
      }

      function renderSidebar() {
        const m = me();
        const pl = $('playerList');
        pl.innerHTML = state.players.map(function (p) {
          const dot = '<span class="dot" style="background:' + colorHex(p.color) + '"></span>';
          const cur = p.is_current ? ' current' : '';
          const off = p.connected ? '' : '<span class="offline">离线</span>';
          const cardsTxt = (p.cards && p.cards.length) ? p.cards.join('、') : '暂无';
          const cardsLine = '<span class="pcards">🃏 已收城市卡：' + cardsTxt + '</span>';
          if (p.bot) {
            return '<div class="player bot' + cur + '">' + dot +
              '<span class="pname">' + p.name + '</span>' +
              '<span class="goal">机器人</span>' +
              '<span class="pscore">' + p.score + '分</span>' +
              cardsLine + '</div>';
          }
          const goal = p.goal_done ? ' ✅目的地已完成' : '';
          // 第 4 张牌是秘密目的地：自己的可见，别人的看不到
          const card4 = m && p.pid === m.pid
            ? '<span class="pcard">🎴 ' + (p.secret || '—') + '</span>'
            : '<span class="pcard">🎴 ？？？</span>';
          return '<div class="player' + cur + '">' + dot +
            '<span class="pname">' + p.name + off + '</span>' +
            '<span class="goal">目标' + goal + '</span>' +
            card4 +
            '<span class="pscore">' + p.score + '分</span>' +
            cardsLine + '</div>';
        }).join('');

        // 每人 4 张牌：前 3 张公共（所有人可见），第 4 张为秘密目的地（仅本人可见）
        const sc = $('sharedCards');
        const pub = state.shared_cards || [];
        const no = ['①', '②', '③', '④'];
        let cardsHtml = '';
        for (let i = 0; i < 3; i++) {
          const c = pub[i];
          cardsHtml += c && c.city
            ? '<div class="cardchip"><div class="cno">' + no[i] + '</div>' +
              '<div class="ccity">' + c.city + '</div><div class="cpts">' + c.points + '分</div></div>'
            : '<div class="cardchip empty"><div class="cno">' + no[i] + '</div><div class="ccity">空</div></div>';
        }
        cardsHtml += (m && m.secret)
          ? '<div class="cardchip secret"><div class="cno">' + no[3] + '</div>' +
            '<div class="ccity">' + m.secret + '</div><div class="cpts">仅你可见</div></div>'
          : '<div class="cardchip secret"><div class="cno">' + no[3] + '</div>' +
            '<div class="ccity">🎴 秘密目的地</div></div>';
        sc.innerHTML = cardsHtml;

        const tb = $('ticketBox');
        if (!m) { tb.innerHTML = ''; }
        else {
          let html = '';
          Object.keys(MAP.colors).forEach(function (c) {
            const n = m.tickets[c] || 0;
            html += '<div class="ticket"><span class="swatch" style="background:' + colorHex(c) + '"></span>' + colorName(c) + ' ' + n + '</div>';
          });
          const w = m.tickets.go || 0;
          html += '<div class="ticket wild"><span class="swatch" style="background:' + colorHex('go') + '"></span>GO ' + w + '</div>';
          tb.innerHTML = html;
        }

        const lb = $('logBox');
        lb.innerHTML = (state.log || []).map(function (l) { return '<div>' + l + '</div>'; }).join('');
        lb.scrollTop = lb.scrollHeight;
      }

      function renderControls() {
        const m = me();
        const isMyTurn = m && state.current_pid === myPid && state.state === 'playing';
        const isHost = state.host_pid === myPid;

        $('roomTag').textContent = '房间号 ' + state.room_id;
        $('roomTag').classList.remove('hidden');

        const turnP = state.players.find(function (p) { return p.pid === state.current_pid; });
        const ti = $('turnInfo');
        if (state.state === 'lobby') {
          ti.textContent = '等待开始（' + state.players.length + '/4 人）';
        } else if (state.state === 'finished') {
          const w = state.players.find(function (p) { return p.pid === state.winner; });
          ti.textContent = w ? ('🎉 ' + w.name + ' 获胜！') : '游戏结束';
        } else {
          ti.textContent = turnP ? ('轮到：' + turnP.name) : '—';
        }

        const tm = $('timerInfo');
        if (state.state === 'playing' && isMyTurn) tm.classList.remove('hidden');
        else tm.classList.add('hidden');

        $('startBtn').classList.toggle('hidden', !(state.state === 'lobby' && isHost));
        // 移动阶段可持续点击走多步，随时可结束回合
        const inLobby = state.state === 'lobby';
        const bots = state.players.filter(function (p) { return p.bot; }).length;
        $('addBotBtn').classList.toggle('hidden', !(inLobby && isHost && state.players.length < 4));
        $('removeBotBtn').classList.toggle('hidden', !(inLobby && isHost && bots > 0));

        const canEnd = isMyTurn && state.phase === 'move';
        $('rollBtn').classList.toggle('hidden', !(isMyTurn && state.phase === 'roll'));
        $('endBtn').classList.toggle('hidden', !canEnd);
        $('rollBtn').disabled = !isMyTurn || state.phase !== 'roll';
        $('endBtn').disabled = !canEnd;
        $('endBtn').textContent = (state.moved ? '结束回合' : '结束回合（不移动）');

        const da = $('diceArea');
        if (state.last_roll && state.last_roll.length) {
          da.innerHTML = state.last_roll.map(function (f) {
            if (f === 'go') return '<div class="die wild">GO</div>';
            return '<div class="die" style="background:' + colorHex(f) + '">' + colorName(f) + '</div>';
          }).join('');
        } else {
          da.innerHTML = '';
        }

        // 移动阶段提示：可继续走，也可结束回合
        const hint = $('moveHint');
        if (isMyTurn && state.phase === 'move') {
          const n = (state.moves || []).length;
          hint.textContent = n
            ? '🖱 点击高亮城市走一步（可继续走多步），走完点“结束回合”'
            : '🚫 没有可走的线路了，点“结束回合”继续';
          hint.classList.remove('hidden');
        } else {
          hint.classList.add('hidden');
        }
      }

      function render() {
        if (!state) return;
        renderBoard();
        renderSidebar();
        renderControls();
      }

      function startTimerTicker() {
        if (timerInt) clearInterval(timerInt);
        timerInt = setInterval(function () {
          if (!state || state.state !== 'playing') return;
          const m = me();
          const isMyTurn = m && state.current_pid === myPid;
          if (isMyTurn && timerLeft > 0) {
            timerLeft--;
            $('timerInfo').textContent = '⏱ ' + timerLeft + 's（超时自动行动）';
          }
        }, 1000);
      }

      function initSocket() {
        const base = serverBase();
        // 强制 polling：部分代理环境会破坏 WebSocket 升级（Bad HTTP/0.9 request type）
        const opts = { transports: ['polling'] };
        socket = base ? io(base, opts) : io(opts);
        socket.on('connect', function () {
          connBadge.classList.remove('bad'); connBadge.classList.add('good');
          connBadge.textContent = '● 已连接服务器';
          if (joined && myRoom && myPid) {
            socket.emit('rejoin', { room_id: myRoom, player_id: myPid });
          }
        });
        socket.on('disconnect', function () {
          connBadge.classList.remove('good'); connBadge.classList.add('bad');
          connBadge.textContent = '● 连接已断开';
        });
        socket.io.on('reconnect_attempt', function () {
          connBadge.classList.remove('good'); connBadge.classList.add('bad');
          connBadge.textContent = '● 正在连接服务器…（失败请检查后端是否启动）';
        });
        socket.on('connect_error', function (err) {
          connBadge.classList.remove('good'); connBadge.classList.add('bad');
          connBadge.textContent = '● 连接失败：请确认后端已启动（python server.py），并检查服务器地址';
        });
        socket.on('created', function (d) {
          myRoom = d.room_id; myPid = d.player_id; joined = true;
          saveCreds(); showScreen('game'); toast('房间已创建：' + myRoom);
        });
        socket.on('joined', function (d) {
          myRoom = d.room_id; myPid = d.player_id; joined = true;
          saveCreds(); showScreen('game'); toast('已加入房间：' + myRoom);
        });
        socket.on('rejoined', function () { showScreen('game'); toast('已重新连接'); });
        socket.on('state', function (s) {
          state = s; timerLeft = s.timer_remaining || 0; render();
        });
        socket.on('error', function (e) {
          const msg = (e && e.msg) || '出错了';
          toast(msg);
          if (!lobby.classList.contains('hidden')) {
            lobbyMsg.textContent = '❌ ' + msg;
            lobbyMsg.classList.remove('hidden');
          }
          if (msg.indexOf('恢复') >= 0 || msg.indexOf('重新加入') >= 0) {
            try { localStorage.removeItem(STORE_KEY); } catch (e2) {}
            myRoom = null; myPid = null; joined = false;
            $('rejoinBox').classList.add('hidden');
          }
        });
        socket.__base = serverBase();
      }

      // 服务器地址变化时，关闭旧连接并按新地址重建（地图缓存同时作废）
      function ensureSocket() {
        const base = serverBase();
        if (socket && socket.__base === base) return;
        if (socket) { try { socket.close(); } catch (e) {} socket = null; }
        MAP = null; ADJ = {};
        initSocket();
      }

      function saveCreds() {
        try { localStorage.setItem(STORE_KEY, JSON.stringify({ room: myRoom, pid: myPid })); } catch (e) {}
      }
      function loadCreds() {
        try { return JSON.parse(localStorage.getItem(STORE_KEY) || 'null'); } catch (e) { return null; }
      }

      function validateName() {
        const n = $('nameInput').value.trim();
        if (!n) { toast('请填写昵称'); return null; }
        return n;
      }

      async function ensureMap() {
        if (MAP) return true;
        try {
          await loadMap();
          lobbyMsg.classList.add('hidden');
          return true;
        } catch (e) {
          lobbyMsg.textContent = '加载地图失败：' + e.message + '。请检查上方"服务器地址"是否为后端直连地址。';
          lobbyMsg.classList.remove('hidden');
          return false;
        }
      }

      $('createBtn').addEventListener('click', async function () {
        const name = validateName(); if (!name) return;
        ensureSocket();
        if (!(await ensureMap())) return;
        saveBase();
        const customRid = $('roomIdInput').value.trim();
        socket.emit('create_room', {
          name: name, password: $('createPwdInput').value, room_id: customRid,
          dice_count: 2, ai_level: $('aiSelect').value,
          timeout: parseInt($('timeoutSelect').value, 10),
          max_players: parseInt($('maxPlayersSelect').value, 10),
          bot_count: parseInt($('botCountSelect').value, 10)
        });
      });

      // 加入房间（房间号来自大厅列表点击；需要密码时由弹框提供）
      async function joinRoom(rid, password) {
        const name = validateName(); if (!name) return;
        if (!/^\d{4}$/.test(rid)) { toast('房间号不正确'); return; }
        ensureSocket();
        if (!(await ensureMap())) return;
        saveBase();
        socket.emit('join_room', { name: name, room_id: rid, password: password || '' });
      }

      $('joinPwdBtn').addEventListener('click', function () {
        const rid = $('roomInput').value.trim();
        $('joinPrompt').classList.add('hidden');
        joinRoom(rid, $('joinPwdInput').value);
      });
      $('cancelJoinBtn').addEventListener('click', function () {
        $('joinPrompt').classList.add('hidden');
      });
      $('joinPwdInput').addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter') $('joinPwdBtn').click();
      });

      $('rejoinBtn').addEventListener('click', function () {
        if (myRoom && myPid) socket.emit('rejoin', { room_id: myRoom, player_id: myPid });
      });
      $('startBtn').addEventListener('click', function () {
        socket.emit('start_game', { room_id: myRoom, player_id: myPid });
      });
      $('addBotBtn').addEventListener('click', function () {
        socket.emit('add_bot', { room_id: myRoom, player_id: myPid });
      });
      $('removeBotBtn').addEventListener('click', function () {
        socket.emit('remove_bot', { room_id: myRoom, player_id: myPid });
      });
      $('rollBtn').addEventListener('click', function () {
        socket.emit('roll', { room_id: myRoom, player_id: myPid });
      });
      $('endBtn').addEventListener('click', function () {
        socket.emit('end_turn', { room_id: myRoom, player_id: myPid });
      });
      $('leaveBtn').addEventListener('click', function () {
        try { localStorage.removeItem(STORE_KEY); } catch (e) {}
        location.reload();
      });

      // 主题切换：亮色 ↔ 暗色（纯 CSS 类切换，不重算几何）
      const THEME_KEY = 'shanzhuan_theme';
      let themeDark = false;
      function applyTheme() {
        $('board').classList.toggle('dark', themeDark);
        $('themeBtn').textContent = themeDark ? '🌙 暗色' : '🌞 亮色';
        try { localStorage.setItem(THEME_KEY, themeDark ? 'dark' : 'light'); } catch (e) {}
      }
      $('themeBtn').addEventListener('click', function () { themeDark = !themeDark; applyTheme(); });
      try { themeDark = localStorage.getItem(THEME_KEY) === 'dark'; } catch (e) {}
      applyTheme();

      (async function boot() {
        try {
          const b = localStorage.getItem(SERVER_KEY) || '';
          if (b) $('serverInput').value = b;
        } catch (e) {}

        try { await loadMap(); }
        catch (e) {
          lobbyMsg.textContent = '加载地图失败：' + e.message + '。请在上方"服务器地址"填写后端直连地址（如 http://localhost:5000）后重试。';
          lobbyMsg.classList.remove('hidden');
        }
        initSocket();
        startTimerTicker();
        loadRooms();
        setInterval(loadRooms, 3000);
        $('refreshRoomsBtn').addEventListener('click', loadRooms);

        const creds = loadCreds();
        if (creds && creds.room && creds.pid) {
          myRoom = creds.room; myPid = creds.pid; joined = true;
          $('rejoinBox').classList.remove('hidden');
        }
      })();

      /* 大厅房间列表：轮询 /api/rooms（内容不变时跳过重渲染） */
      let lastRoomsJson = '';
      async function loadRooms() {
      const box = document.getElementById('roomList');
      if (!box || document.getElementById('lobby').classList.contains('hidden')) return;
      let list = null;
      try {
        const res = await fetch(serverBase() + '/api/rooms');
        if (res.ok) list = (await res.json()).rooms;
      } catch (e) {}
      if (!list) { box.innerHTML = '<div class="room-empty">房间列表加载失败（请检查后端）</div>'; return; }
      const j = JSON.stringify(list);
      if (j === lastRoomsJson && box.children.length && !box.querySelector('.room-empty')) return;
      lastRoomsJson = j;
      if (!list.length) { box.innerHTML = '<div class="room-empty">暂无可加入的房间，可以先"创建房间"</div>'; return; }
      box.innerHTML = '';
      list.forEach(function (r) {
        const div = document.createElement('div');
        div.className = 'room-item';
        div.dataset.rid = r.room_id;
        div.dataset.pwd = r.has_password ? '1' : '';
        const pwd = r.has_password ? '🔒 有密码' : '🔓 无密码';
        const people = r.humans + ' 人类 · ' + r.bots + ' 机器人';
        div.innerHTML = '<span class="rid">' + r.room_id + '</span>' +
          '<span class="meta">👤 ' + (r.creator || '房主') + ' 创建 · ' + pwd + '<br>' +
          '当前 ' + people + ' / 共 ' + r.max_players + ' 人</span>';
        box.appendChild(div);
      });
      }

      // 事件委托：点击列表中的房间直接加入；有密码则弹出密码框
      $('roomList').addEventListener('click', function (ev) {
        const item = ev.target.closest('.room-item');
        if (!item) return;
        const rid = item.dataset.rid;
        $('roomInput').value = rid;
        if (item.dataset.pwd) {
          $('joinPromptRoom').textContent = rid;
          $('joinPwdInput').value = '';
          $('joinPrompt').classList.remove('hidden');
          $('joinPwdInput').focus();
        } else {
          joinRoom(rid, '');
        }
      });
    }

    /* Socket.IO 客户端已内联，直接启动应用 */
    window.__ioLoaded = true;
    startApp();
  </script>
</body>
</html>
